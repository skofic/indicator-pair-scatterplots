# 30 refused logins from one address within 10 minutes: the address is cut off from the web sites for one hour.
# A browser is refused once or twice before it asks for the password, so ordinary visits stay far below the limit.
# The ban sits in Docker's DOCKER-USER chain, in front of the web server container (ssh is not affected).
[caddy-auth]
enabled = true
filter = caddy-auth
logpath = /opt/panes/logs/access.log
backend = polling
maxretry = 30
findtime = 10m
bantime = 1h
banaction = iptables-allports
chain = DOCKER-USER
protocol = all
