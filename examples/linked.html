<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map ↔ scatterplot</title>
<link rel="stylesheet" href="panes.css">
<style>
  html, body { overflow: hidden }
  #panes { --split: 50%; flex: 1 1 auto; min-height: 0; display: grid; background: #bbb }
  /* the layout follows the window's shape: side by side when wider than tall, stacked when taller; the divider resizes */
  #panes.auto, #panes.side { grid-template-columns: var(--split) 7px minmax(0, 1fr) }
  #panes.stack { grid-template-rows: var(--split) 7px minmax(0, 1fr) }
  @media (max-aspect-ratio: 5/4) { #panes.auto { grid-template-columns: none; grid-template-rows: var(--split) 7px minmax(0, 1fr) } }
  #divider { background: #bbb; cursor: col-resize; position: relative }
  #divider::after { content: ''; position: absolute; left: 2px; right: 2px; top: 50%; height: 32px; margin-top: -16px; border-radius: 2px; background: #888 }
  #panes.stack #divider, #panes.auto.stacked #divider { cursor: row-resize }
  #panes.stack #divider::after, #panes.auto.stacked #divider::after { top: 2px; bottom: 2px; left: 50%; height: auto; width: 32px; margin: 0 0 0 -16px }
  #panes.detached { grid-template-columns: 1fr; grid-template-rows: 1fr } #panes.detached #map, #panes.detached #divider { display: none }
  #panes.dragging iframe { pointer-events: none }
  iframe { border: 0; width: 100%; height: 100%; min-height: 0; background: #fff }
  #bar { border-bottom: 1px solid #bbb }
  .group.right { margin-left: auto; border-right: 0 }
</style>
</head>
<body>
<!-- The host page owns the shared state (species, country, unit, restriction level, flag distance, layout, map placement)
     and relays the panes' messages. Every label is a dictionary term; every control is bound to a state key (its gid);
     the units and species come from the panes' Foxx service. -->
<div id="bar" class="toolbar">
  <strong data-term="ui_layout"></strong>
  <span class="group"><span class="cap" data-term="ui_layout_label_unit"></span>
    <span class="search"><input id="q" type="search" autocomplete="off" spellcheck="false"><div id="suggest" class="suggest"></div></span>
    <span id="chips"></span>
    <span id="info" class="hints"></span>
  </span>
  <span class="group"><span class="cap" data-term="gcu_loc_coordinates-restriction"></span>
    <label><span data-term="gcu_loc_coordinates-restriction_level"></span> <select data-key="gcu_loc_coordinates-restriction_level"></select></label>
    <label><span data-term="gcu_loc_climate_flag"></span> &gt; <select data-key="gcu_loc_climate_flag"><option>1</option><option>2</option><option>5</option><option>10</option><option>20</option></select> km</label>
  </span>
  <span class="group" id="clearGroup" style="display:none"><span class="cap" data-term="ui_layout_scatterplot_label_map-selection"></span><button id="clear" data-term="ui_layout_label_clear"></button></span>
  <span class="group right"><span class="cap" data-term="ui_layout_mode"></span><select data-key="ui_layout_mode"></select>
    <label><span data-term="ui_layout_map_placement"></span> <select data-key="ui_layout_map_placement"></select></label>
  </span>
</div>
<div id="panes" class="auto">
  <iframe id="map"></iframe>
  <div id="divider" title="drag to resize · double-click to reset"></div>
  <iframe id="scatter"></iframe>
</div>
<script src="dictionary.js"></script>
<script src="service.js"></script>
<script>
const $ = (id) => document.getElementById(id), $K = (k) => document.querySelector(`[data-key="${k}"]`)
const K = { species: 'species', country: 'gcu_id_country', unit: 'gcu_id_number', level: 'gcu_loc_coordinates-restriction_level', flag: 'gcu_loc_climate_flag', mode: 'ui_layout_mode', placement: 'ui_layout_map_placement', sel: 'ui_layout_map_selection' }
const SHARED = [K.species, K.country, K.unit, K.level, K.flag]   // what the panes receive
const E = (root, ...lids) => lids.map((l) => `${root}_${l}`)
const OPT = { [K.level]: E('gcu_loc_coordinates-restriction', 'public', 'value', 'manage'), [K.mode]: E('ui_layout_mode', 'auto', 'side', 'stack'), [K.placement]: E('ui_layout_map_placement', 'page', 'tab', 'window') }
const DIST = 'gcu_loc_climate_distance'
const last = Dict.last
let state = {}, cat, ix = [], popup = null
// the map pane is the iframe, or the detached tab / window while that is open
const mapW = () => (popup && !popup.closed ? popup : $('map').contentWindow), scatterW = () => $('scatter').contentWindow
function send(keys = SHARED) { const msg = { type: 'state' }; for (const k of keys) msg[k] = state[k] ?? null; mapW().postMessage(msg, '*'); scatterW().postMessage(msg, '*') }
const match = (u, c, s) => (!c || u.gcu_id_number.startsWith(c)) && (!s || u.species_list.includes(s))
const flag = (u) => u[DIST] != null && u[DIST] > state[K.flag]
const flagsOf = (s) => cat.species.find((x) => x.species === s)
/** the filter as chips: the species (always one), the country and the unit (removable) */
function refill() {
  const country = state[K.country] ? Dict.aid(state[K.country]) : '', species = state[K.species], T = Dict.title
  const sel = ix.filter((u) => match(u, country, species))
  const chip = (text, key, title) => `<span class="chip${key ? '' : ' fixed'}" title="${title ?? ''}">${text}${key ? `<span class="x" data-clear="${key}" title="${T('ui_layout_label_clear')}">×</span>` : ''}</span>`
  $('chips').innerHTML = chip(species, null, T('ui_layout_label_species')) + (state[K.country] ? chip(T(state[K.country]), K.country, T('ui_layout_label_country')) : '') + (state[K.unit] ? chip(state[K.unit], K.unit, T('ui_layout_label_unit')) : '')
  for (const x of $('chips').querySelectorAll('.x')) x.addEventListener('click', () => { state[x.dataset.clear] = null; if (x.dataset.clear === K.country) state[K.unit] = null; refill(); send() })
  const nf = sel.filter(flag).length; $('info').textContent = `${sel.length} ${T('ui_layout_label_unit').toLowerCase()}s · ${sel.filter((u) => u['gcu_loc_coordinates-restriction']).length} ${T('ui_layout_label_restricted')}${nf ? ` · ⚠ ${nf}` : ''} · ● ${T('ui_layout_map_label_presence')} · ▦ ${T('ui_layout_scatterplot')}`; $('info').title = `⚠ = ${T('ui_layout_label_flagged')} (> ${state[K.flag]} km)`
}
/** suggestions for what is typed: species (name), countries (name or code), units (number), each group capped */
function suggest(q) {
  const box = $('suggest'), T = Dict.title, s = q.trim().toLowerCase()
  if (s.length < 2) { box.classList.remove('open'); box.innerHTML = ''; return }
  const country = state[K.country] ? Dict.aid(state[K.country]) : ''
  const counts = new Map(); for (const u of ix.filter((u) => match(u, country, ''))) for (const sp of u.species_list) counts.set(sp, (counts.get(sp) ?? 0) + 1)
  const species = [...counts].filter(([n]) => n.toLowerCase().includes(s)).sort((a, b) => b[1] - a[1]).slice(0, 8)
  const countries = cat.countries.filter((c) => c.code.toLowerCase().startsWith(s) || T(c[K.country]).toLowerCase().includes(s)).slice(0, 6)
  const units = ix.filter((u) => u.gcu_id_number.toLowerCase().startsWith(s) && match(u, country, state[K.species])).slice(0, 8)
  const item = (kind, value, text, meta) => `<div class="item" data-kind="${kind}" data-value="${value}"><span>${text}</span><span class="meta">${meta}</span></div>`
  box.innerHTML = (species.length ? `<div class="head">${T('ui_layout_label_species')}</div>` + species.map(([n, c]) => item('species', n, `${n}${flagsOf(n)?.atlas_rpp ? ' ●' : ''}${flagsOf(n)?.scatterplot ? ' ▦' : ''}`, `${c} ${T('ui_layout_label_unit').toLowerCase()}s`)).join('') : '')
    + (countries.length ? `<div class="head">${T('ui_layout_label_country')}</div>` + countries.map((c) => item('country', c[K.country], T(c[K.country]), `${c.code} · ${c.units}`)).join('') : '')
    + (units.length ? `<div class="head">${T('ui_layout_label_unit')}</div>` + units.map((u) => item('unit', u.gcu_id_number, u.gcu_id_number + (u['gcu_loc_coordinates-restriction'] ? ` (${T('ui_layout_label_restricted')})` : ''), `${u.species_list.slice(0, 2).join(', ')}${u.species_list.length > 2 ? ', …' : ''}${flag(u) ? ' ⚠' : ''}`)).join('') : '')
  box.classList.toggle('open', box.innerHTML !== '')
  for (const el of box.querySelectorAll('.item')) el.addEventListener('mousedown', (e) => { e.preventDefault(); pick(el.dataset.kind, el.dataset.value) })
  box.querySelector('.item')?.classList.add('active')
}
function pick(kind, value) {
  if (kind === 'species') { state[K.species] = value; state[K.country] = null; state[K.unit] = null }
  else if (kind === 'country') { state[K.country] = value; state[K.unit] = null }
  else if (kind === 'unit') { const u = ix.find((x) => x.gcu_id_number === value); state[K.unit] = value; if (u && !u.species_list.includes(state[K.species])) state[K.species] = u.species_list[0]; state[K.country] = 'ISO_3166_1_' + value.slice(0, 3) }
  $('q').value = ''; $('suggest').classList.remove('open'); refill(); send()
}
const read = (el) => el.dataset.key === K.flag ? Number(el.value) : (el.value === '' ? null : el.value)
const ON = {
  [K.flag]: () => { refill(); send() }, [K.level]: async () => { ix = await Svc.unitsIndex(state[K.level]); refill(); send() },
  [K.mode]: () => { $('panes').className = last(state[K.mode]); stackedFlag() }, [K.placement]: place,
}
const panes = $('panes'), stacked = () => panes.classList.contains('stack') || (panes.classList.contains('auto') && matchMedia('(max-aspect-ratio: 5/4)').matches)
function stackedFlag() { panes.classList.toggle('stacked', stacked()) }
// the map in its own tab or window: same page, same messages (it posts to window.opener); closing it brings it back.
// Without a size, window.open gives a tab; with one, a window — the browser's rule.
function place() {
  const v = last(state[K.placement])
  if (popup && !popup.closed) popup.close()
  if (v === 'page') return
  popup = window.open(paneUrl('map-openlayers.html'), 'eufgis-map', v === 'window' ? 'width=1100,height=800' : '')
  if (!popup) { $('info').textContent = 'the browser blocked the new tab or window'; state[K.placement] = OPT[K.placement][0]; $K(K.placement).value = state[K.placement]; return }
  panes.classList.add('detached')
  popup.addEventListener('load', () => setTimeout(() => send(), 1200))
  const watch = setInterval(() => { if (popup.closed) { clearInterval(watch); popup = null; panes.classList.remove('detached'); state[K.placement] = OPT[K.placement][0]; $K(K.placement).value = state[K.placement]; send() } }, 500)
}
// the panes get the same language, dictionary and service as this page
const q = new URLSearchParams(location.search)
const paneUrl = (page, extra = '') => `${page}?embedded=1${['lang', 'dict', 'api'].filter((k) => q.get(k)).map((k) => `&${k}=${encodeURIComponent(q.get(k))}`).join('')}${extra}`
Promise.all([Svc.catalogue(), Dict.defaults()]).then(async ([c, defaults]) => {
  cat = c
  state = { ...defaults, [K.species]: 'Fagus sylvatica', [K.level]: 'gcu_loc_coordinates-restriction_value' }   // the scatterplot default: restricted units' values are shown
  for (const k of Object.values(K)) if (q.has(k)) state[k] = q.get(k)
  ix = await Svc.unitsIndex(state[K.level])
  await Dict.load([...Object.values(K), ...Object.values(OPT).flat(), ...c.countries.map((x) => x[K.country]), 'ui_layout', 'ui_layout_scatterplot', 'ui_layout_scatterplot_label_map-selection', 'gcu_loc_coordinates-restriction', 'ui_layout_label_species', 'ui_layout_label_country', 'ui_layout_label_unit', 'ui_layout_label_clear', 'ui_layout_label_restricted', 'ui_layout_label_flagged', 'ui_layout_map_label_presence'])
  await Dict.labels()
  for (const el of document.querySelectorAll('[data-key]')) {
    const k = el.dataset.key
    el.dataset.fieldDef = Dict.def(k)
    if (OPT[k]) Dict.options(el, OPT[k], state[k]); else { if (state[k] != null) el.value = state[k]; Dict.hover(el) }
    el.addEventListener('change', () => { state[k] = read(el); (ON[k] ?? send)() })
  }
  refill(); stackedFlag(); matchMedia('(max-aspect-ratio: 5/4)').addEventListener('change', stackedFlag)
  // the search box: type a species, a country or a unit number; Enter takes the highlighted suggestion, Escape closes
  const q$ = $('q'); q$.placeholder = `${Dict.title('ui_layout_label_species')} · ${Dict.title('ui_layout_label_country')} · ${Dict.title('ui_layout_label_unit')}`; q$.title = Dict.def('ui_layout_label_unit')
  q$.addEventListener('input', () => suggest(q$.value))
  q$.addEventListener('focus', () => suggest(q$.value)); q$.addEventListener('blur', () => setTimeout(() => $('suggest').classList.remove('open'), 150))
  q$.addEventListener('keydown', (e) => {
    const items = [...$('suggest').querySelectorAll('.item')], i = items.findIndex((x) => x.classList.contains('active'))
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[i]?.classList.remove('active'); items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length]?.classList.add('active') }
    else if (e.key === 'Enter' && items[i]) pick(items[i].dataset.kind, items[i].dataset.value)
    else if (e.key === 'Escape') { $('suggest').classList.remove('open'); q$.blur() }
  })
  // ---- the divider: drag resizes the panes along the layout's axis, double-click resets
  $('divider').addEventListener('mousedown', (e) => {
    e.preventDefault(); panes.classList.add('dragging')
    const r = panes.getBoundingClientRect(), v = stacked()
    const move = (ev) => { const f = v ? (ev.clientY - r.top) / r.height : (ev.clientX - r.left) / r.width; panes.style.setProperty('--split', `${Math.min(85, Math.max(15, f * 100)).toFixed(1)}%`) }
    const up = () => { panes.classList.remove('dragging'); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up) }
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up)
  })
  $('divider').addEventListener('dblclick', () => panes.style.removeProperty('--split'))
  $('clear').addEventListener('click', () => { for (const w of [mapW(), scatterW()]) w.postMessage({ type: 'state', [K.sel]: null }, '*'); $('clearGroup').style.display = 'none' })
  // the panes load after this page: send the shared state once both are ready
  let loaded = 0; for (const id of ['map', 'scatter']) $(id).addEventListener('load', () => { if (++loaded === 2) setTimeout(() => send(), 1200) })
  const wc = c.climates.find((k) => k.src === 'worldclim' && k.period === '2081-2100') ?? c.climates.find((k) => k.src === 'worldclim' && !k.present)
  $('map').src = paneUrl('map-openlayers.html')
  $('scatter').src = paneUrl('scatter-d3-canvas.html', `&species=${encodeURIComponent(state[K.species])}&std_dataset_ids=${encodeURIComponent(JSON.stringify([wc.std_dataset_ids]))}&env_climate_scenario=${wc.env_climate_scenario}&env_climate_period=${wc.env_climate_period}`)
}).catch((e) => { $('info').textContent = `service unavailable: ${e.message} (${Svc.BASE})` })
// relay: a message is a partial state; the map's selection goes to the scatterplot, the scatterplot's clear to the map,
// a species chosen on the map becomes the shared species. In the portal the host checks the origin of every message.
window.addEventListener('message', (e) => {
  const d = e.data; if (d?.type !== 'state') return
  if (K.sel in d) {
    if (e.source === mapW()) scatterW().postMessage(d, '*')
    else if (e.source === scatterW()) mapW().postMessage({ type: 'state', [K.sel]: null }, '*')
    $('clearGroup').style.display = d[K.sel] ? '' : 'none'
  }
  if (K.species in d && e.source === mapW() && d[K.species] !== state[K.species]) { state[K.species] = d[K.species]; state[K.country] = null; state[K.unit] = null; refill(); scatterW().postMessage({ type: 'state', [K.species]: state[K.species], [K.country]: null, [K.unit]: null }, '*') }
})
</script>
</body>
</html>
