<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map — OpenLayers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #222; background: #fff }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #ddd }
  header label { display: inline-flex; gap: 6px; align-items: center }
  #map { height: calc(100vh - 150px); margin: 0 8px }
  #info { padding: 6px 16px; font-size: 13px; color: #333; min-height: 2.6em }
  input.op { width: 70px; vertical-align: middle }
  #search { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 8px 16px; background: #f6f6f6; border-bottom: 1px solid #ddd }
  #search select { max-width: 260px }
  .legend i { display: inline-block; width: 14px; height: 10px; vertical-align: -1px; margin: 0 4px 0 8px }
  .basemap-gray canvas { filter: grayscale(100%) brightness(1.05) }
</style>
</head>
<body>
<header>
  <strong>OpenLayers</strong>
  <label>Base map <select id="basemap">
    <option value="none">none</option>
    <option value="boundaries">country boundaries only (Natural Earth)</option>
    <option value="hillshade">Esri hillshade only</option>
    <option value="osm-gray" selected>OpenStreetMap, grey</option>
    <option value="osm">OpenStreetMap, colour</option>
    <option value="topo">OpenTopoMap (relief, contours)</option>
  </select></label>
  <label><input type="checkbox" id="rpp" checked> Atlas relative probability of presence (1 km COG) <input type="range" class="op" data-layer="rpp" min="0" max="100" value="85" title="opacity"></label>
  <label><input type="checkbox" id="mhs"> Atlas maximum habitat suitability <input type="range" class="op" data-layer="mhs" min="0" max="100" value="85" title="opacity"></label>
  <label><input type="checkbox" id="t4cur"> EU-Trees4F current, realised (10 km) <input type="range" class="op" data-layer="t4cur" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="t4fut"> EU-Trees4F 2095 RCP 8.5, natural dispersal <input type="range" class="op" data-layer="t4fut" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="choro" checked> chorology (native range) <input type="range" class="op" data-layer="choro" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="units" checked> units <input type="range" class="op" data-layer="units" min="0" max="100" value="100" title="opacity"></label>
  <span class="legend"><i style="background:#1a7a1a"></i>presence<i style="background:#1f4e9c"></i>suitability<i style="background:rgba(255,214,0,.65)"></i>EU-Trees4F 2005<i style="background:rgba(233,30,99,.6)"></i>EU-Trees4F 2095<i style="border:2px dashed #6a1b9a;height:6px;width:10px"></i>chorology<i style="border:2px solid #e06a00;height:8px;width:10px"></i>units</span>
</header>
<div id="search">
  <strong>Units</strong>
  <label>Country <select id="country"><option value="">all</option></select></label>
  <label>Species <select id="speciesSel"></select></label>
  <label>Unit <select id="unitSel"><option value="">—</option></select></label>
  <label><input type="checkbox" id="showRestricted" disabled> show restricted (never on the map)</label>
  <span id="searchInfo"></span>
  <span id="layersInfo" style="color:#555"></span>
</div>
<div id="map"></div>
<div id="info">Click the map to read the values at that location — the values are what the scatterplot would be asked to show.</div>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js"></script>
<!-- the OpenLayers full build does not bundle the GeoTIFF reader: it expects the `GeoTIFF` global from geotiff.js -->
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>
<script>
// The view works in the Atlas rasters' native projection (ETRS89-LAEA, EPSG:3035), so the 1 km COGs are never
// warped; the OSM base tiles and the vectors (WGS84) are reprojected by OpenLayers.
proj4.defs('EPSG:3035', '+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs')
ol.proj.proj4.register(proj4)
const laea = ol.proj.get('EPSG:3035'); laea.setExtent([1896628.62, 1507846.05, 7104179.80, 6829874.45])   // EPSG:3035 projected bounds; the Atlas rasters span x 2.5–7.4 M, y 1.3–5.6 M
const DATA = '../work/examples/data/', $ = (id) => document.getElementById(id)
const cogSource = (path) => new ol.source.GeoTIFF({ sources: [{ url: '../' + path }], normalize: false, interpolate: false })
const cog = (style) => new ol.layer.WebGLTile({ style, opacity: 0.85 })
// Atlas RPP: Float32 0…1 with −1 = uncertain / no data; MHS: 0…1; EU-Trees4F bin: 0/1 Int16 on the 10 km INSPIRE grid
const ramp = (from, to) => ['interpolate', ['linear'], ['band', 1], 0, [255, 255, 255, 0], 0.05, [...from, 0.25], 1, [...to, 1]]
const rpp = cog({ color: ['case', ['<', ['band', 1], 0], [0, 0, 0, 0], ramp([200, 230, 180], [26, 122, 26])] })
const mhs = cog({ color: ramp([200, 215, 240], [31, 78, 156]) })
// EU-Trees4F binary layers: the realised ("nat") variant exists for the current period only; future periods come
// as potential ("pot"), natural dispersal ("disp") and their land-use clips.
const bin = (rgba) => cog({ color: ['case', ['>=', ['band', 1], 1], rgba, [0, 0, 0, 0]] })
const t4cur = bin([255, 214, 0, 0.65]), t4fut = bin([233, 30, 99, 0.6])
const gj = new ol.format.GeoJSON({ dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3035' })
const choro = new ol.layer.Vector({ source: new ol.source.Vector(), style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#6a1b9a', width: 2.5, lineDash: [8, 5] }), fill: new ol.style.Fill({ color: 'rgba(106,27,154,.05)' }) }) })
const units = new ol.layer.Vector({ source: new ol.source.Vector(), style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#e06a00', width: 2 }), fill: new ol.style.Fill({ color: 'rgba(224,106,0,.25)' }), image: new ol.style.Circle({ radius: 4, fill: new ol.style.Fill({ color: '#e06a00' }), stroke: new ol.style.Stroke({ color: '#fff', width: 1 }) }) }) })
const layers = { rpp, mhs, t4cur, t4fut, choro, units }
// base maps (raster tiles in Web Mercator, reprojected by OpenLayers to EPSG:3035)
const xyz = (url, attributions) => new ol.layer.Tile({ source: new ol.source.XYZ({ url, attributions, crossOrigin: 'anonymous', maxZoom: 17 }), opacity: 0.7 })
const basemaps = {
  boundaries: new ol.layer.Vector({ source: new ol.source.Vector({ url: '../maps/basemap/ne_50m_admin_0_countries.geojson', format: new ol.format.GeoJSON({ dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3035' }) }),
    style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#8a8a8a', width: 0.8 }), fill: new ol.style.Fill({ color: '#f4f4f0' }) }), background: '#dfe9f3' }),
  'osm-gray': new ol.layer.Tile({ source: new ol.source.OSM({ crossOrigin: 'anonymous' }), opacity: 0.7, className: 'basemap-gray' }),
  topo: xyz('https://tile.opentopomap.org/{z}/{x}/{y}.png', '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)'),
  hillshade: xyz('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', 'Esri, USGS, NOAA'),
  osm: new ol.layer.Tile({ source: new ol.source.OSM(), opacity: 0.7 }),
}
for (const [k, l] of Object.entries(basemaps)) l.setVisible(k === 'osm-gray')
const map = new ol.Map({ target: 'map', layers: [...Object.values(basemaps), ...Object.values(layers)],
  view: new ol.View({ projection: laea, center: ol.proj.fromLonLat([10, 50], laea), zoom: 4 }) })
$('basemap').addEventListener('change', (e) => { for (const [k, l] of Object.entries(basemaps)) l.setVisible(k === e.target.value) })
for (const [id, l] of Object.entries(layers)) { l.setVisible($(id).checked); $(id).addEventListener('change', (e) => l.setVisible(e.target.checked)) }
for (const r of document.querySelectorAll('input.op')) { const l = layers[r.dataset.layer]; l.setOpacity(r.value / 100); r.addEventListener('input', () => l.setOpacity(r.value / 100)) }

// ---- species → map layers (from the ScatterMaps manifest), units → vector layer; the search pane filters live
let ix, mapIndex, allUnits = []
const state = { country: '', species: 'Fagus sylvatica', unit: '' }
function showSpeciesLayers(name) {
  const e = mapIndex.species[name] ?? { eutrees4f: {}, chorology: [] }
  const set = (layer, path) => { layer.setSource(path ? cogSource(path) : null); $(layer === rpp ? 'rpp' : layer === mhs ? 'mhs' : layer === t4cur ? 't4cur' : 't4fut').parentElement.style.opacity = path ? 1 : 0.4 }
  set(rpp, e.atlas_rpp); set(mhs, e.atlas_mhs); set(t4cur, e.eutrees4f['cur2005|cur|nat']); set(t4fut, e.eutrees4f['fut2095|rcp85|disp'])
  choro.getSource().clear()
  for (const c of e.chorology.filter((c) => c.layer.startsWith('native range'))) fetch('../' + c.path).then((r) => r.json()).then((g) => choro.getSource().addFeatures(gj.readFeatures(g)))
  $('layersInfo').textContent = `${name}: ` + [e.atlas_rpp && 'Atlas presence', e.atlas_mhs && 'Atlas suitability', Object.keys(e.eutrees4f).length && `EU-Trees4F (${Object.keys(e.eutrees4f).length} binary layers)`, e.chorology.length && 'chorology'].filter(Boolean).join(', ') || `${name}: no map layer in any source`
}
function refill() {
  const { country, species } = state
  const match = (u, c, s) => (!c || u.country === c) && (!s || u.species.includes(s))
  const sel = ix.units.filter((u) => match(u, country, species))
  // facets: each list counts the units that match the OTHER selections (metadata-store behaviour)
  const facet = (el, items, key, label, current) => {
    el.innerHTML = '<option value="">all</option>'
    for (const [v, n] of items) el.add(new Option(`${label(v)} (${n})`, v, false, v === current))
  }
  const count = (list, pick) => { const m = new Map(); for (const u of list) for (const k of [].concat(pick(u))) m.set(k, (m.get(k) ?? 0) + 1); return [...m].sort((a, b) => a[0].localeCompare(b[0])) }
  facet($('country'), count(ix.units.filter((u) => match(u, '', species)), (u) => u.country), 'country', (v) => v, country)
  facet($('speciesSel'), count(ix.units.filter((u) => match(u, country, '')), (u) => u.species), 'species', (v) => v + (mapIndex.species[v]?.atlas_rpp ? ' ●' : ''), species)
  const unitSel = $('unitSel'); unitSel.innerHTML = '<option value="">—</option>'
  for (const u of sel) unitSel.add(new Option(u.id + (u.restricted ? ' (restricted)' : ''), u.id, false, u.id === state.unit))
  $('searchInfo').textContent = `${sel.length} units, ${sel.filter((u) => u.restricted).length} restricted (not on the map) · ● species with an Atlas map`
  const ids = new Set(sel.map((u) => u.id))
  units.getSource().clear(); units.getSource().addFeatures(allUnits.filter((f) => ids.has(f.get('id'))))
}
Promise.all([fetch(DATA + 'units-index.json').then((r) => r.json()), fetch(DATA + 'map-index.json').then((r) => r.json()), fetch(DATA + 'units-geo-all.geojson').then((r) => r.json())]).then(([a, b, g]) => {
  ix = a; mapIndex = b; allUnits = gj.readFeatures(g)
  refill(); showSpeciesLayers(state.species)
  $('country').addEventListener('change', (e) => { state.country = e.target.value; state.unit = ''; refill() })
  $('speciesSel').addEventListener('change', (e) => { state.species = e.target.value; state.unit = ''; refill(); showSpeciesLayers(state.species) })
  $('unitSel').addEventListener('change', (e) => {
    state.unit = e.target.value
    const f = allUnits.find((f) => f.get('id') === state.unit)
    if (f) map.getView().fit(f.getGeometry().getExtent(), { padding: [60, 60, 60, 60], maxZoom: 11, duration: 600 })
    else if (state.unit) $('info').textContent = `${state.unit}: restricted coordinates, not shown on the map (its climate is in the scatterplot)`
  })
})
map.on('singleclick', (e) => {
  const [lon, lat] = ol.proj.toLonLat(e.coordinate, laea)
  const read = (l) => { if (!l.getSource()) return null; const d = l.getData(e.pixel); return d ? d[0] : null }
  const parts = [`<b>${lat.toFixed(4)}, ${lon.toFixed(4)}</b>`]
  for (const [name, l] of [['Atlas presence', rpp], ['Atlas suitability', mhs], ['EU-Trees4F 2005', t4cur], ['EU-Trees4F 2095 RCP 8.5', t4fut]]) { const v = read(l); if (v != null && l.getVisible()) parts.push(`${name}: ${v < 0 ? 'no data' : v.toFixed(2)}`) }
  const hit = map.getFeaturesAtPixel(e.pixel, { layerFilter: (l) => l === units })
  if (hit.length) parts.push(`unit <b>${hit[0].get('id')}</b> (${hit[0].get('species').join(', ')})`)
  parts.push('→ in the product, this location is sent to the Foxx service (<code>/worldclim/click</code>) and drawn as a point in the scatterplot')
  $('info').innerHTML = parts.join(' · ')
})
</script>
</body>
</html>
