<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map — OpenLayers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">
<link rel="stylesheet" href="panes.css">
<style>
  #map { flex: 1 1 auto; min-height: 320px; margin: 0 6px; position: relative }
  #info { padding: 4px 10px; font-size: 12px; color: var(--muted); min-height: 2.4em; border-top: 1px solid var(--line); background: var(--bar); flex: none }
  .basemap-gray canvas { filter: grayscale(100%) brightness(1.05) }
</style>
</head>
<body>
<!-- Every label is a dictionary term (data-term); every control is bound to a key of the pane state (data-key = the term's
     gid). The data comes from the panes' Foxx service (service.js), the texts from the dictionary service (dictionary.js);
     the rasters and chorology files come from the static host (here: this repository served by examples/serve.mjs). -->
<div class="toolbar">
  <strong class="pane-title" data-term="ui_layout_map"></strong>
  <span class="group"><span class="cap" data-term="ui_layout_map_layer_base"></span><select data-key="ui_layout_map_layer_base"></select></span>
  <span class="group"><span class="cap" data-term="ui_layout_map_draw-mode"></span><select data-key="ui_layout_map_draw-mode"></select> <button id="drawClear" data-term="ui_layout_label_clear"></button></span>
  <span class="break"></span>
  <span class="group"><button id="settings" class="toggle" data-term="ui_layout_map_layer"></button> <button id="reset" data-term="ui_layout_label_reset"></button></span>
</div>
<div class="toolbar collapsible">
  <span class="group"><span class="cap">Atlas</span>
    <label><input type="checkbox" data-key="ui_layout_map_layer_rpp"> <span data-term="ui_layout_map_layer_rpp"></span> <input type="range" data-key="ui_layout_map_layer_rpp_opacity" min="0" max="100"></label>
    <label><input type="checkbox" data-key="ui_layout_map_layer_mhs"> <span data-term="ui_layout_map_layer_mhs"></span> <input type="range" data-key="ui_layout_map_layer_mhs_opacity" min="0" max="100"></label>
  </span>
  <span class="group"><span class="cap">EU-Trees4F</span>
    <label><input type="checkbox" data-key="ui_layout_map_layer_t4-current"> <span data-term="ui_layout_map_layer_t4-current"></span> <input type="range" data-key="ui_layout_map_layer_t4-current_opacity" min="0" max="100"></label>
    <label><input type="checkbox" data-key="ui_layout_map_layer_t4-future"> <span data-term="ui_layout_map_layer_t4-future"></span> <select id="t4period"></select> <select data-key="ui_layout_scatterplot_view_classes_variant"></select> <input type="range" data-key="ui_layout_map_layer_t4-future_opacity" min="0" max="100"></label>
  </span>
  <span class="group"><span class="cap" data-term="ui_layout_map_layer"></span>
    <label><input type="checkbox" data-key="ui_layout_map_layer_chorology"> <span data-term="ui_layout_map_layer_chorology"></span> <input type="range" data-key="ui_layout_map_layer_chorology_opacity" min="0" max="100"></label>
    <label><input type="checkbox" data-key="ui_layout_map_layer_units"> <span data-term="ui_layout_map_layer_units"></span> <input type="range" data-key="ui_layout_map_layer_units_opacity" min="0" max="100"></label>
  </span>
</div>
<div class="toolbar secondary host" id="search">
  <span class="group"><span class="cap" data-term="ui_layout_label_unit"></span>
    <label><span data-term="ui_layout_label_species"></span> <select data-key="species"></select></label>
    <label><span data-term="ui_layout_label_country"></span> <select data-key="gcu_id_country"></select></label>
    <label><span data-term="ui_layout_label_unit"></span> <select data-key="gcu_id_number"></select></label>
    <span id="searchInfo" class="hints"></span>
  </span>
  <span class="group"><span class="cap" data-term="gcu_loc_coordinates-restriction"></span>
    <label><span data-term="gcu_loc_climate_flag"></span> &gt; <select data-key="gcu_loc_climate_flag"><option>1</option><option>2</option><option>5</option><option>10</option><option>20</option></select> km</label>
  </span>
</div>
<div class="legend"><span class="info" id="status">i</span>
  <span class="tog" data-toggle="ui_layout_map_layer_rpp"><i class="sq" style="background:var(--presence)"></i><span data-term="ui_layout_map_label_presence"></span></span>
  <span class="tog" data-toggle="ui_layout_map_layer_mhs"><i class="sq" style="background:var(--suitability)"></i><span data-term="ui_layout_map_label_suitability"></span></span>
  <span class="tog" data-toggle="ui_layout_map_layer_t4-current"><i class="sq" style="background:var(--t4cur)"></i><span data-term="ui_layout_map_label_t4-current"></span></span>
  <span class="tog" data-toggle="ui_layout_map_layer_t4-future"><i class="sq" style="background:var(--t4fut)"></i><span data-term="ui_layout_map_label_t4-future"></span></span>
  <span class="tog" data-toggle="ui_layout_map_layer_chorology"><i class="sq" style="border:2px dashed var(--chorology);background:none;height:5px"></i><span data-term="ui_layout_map_label_chorology"></span></span>
  <span class="tog" data-toggle="ui_layout_map_layer_units"><i style="background:var(--unit)"></i><span data-term="ui_layout_map_label_units"></span></span>
  <span><i style="border:1.5px dashed var(--flag);background:none;width:8px;height:8px"></i><span data-term="ui_layout_label_flagged"></span></span>
</div>
<div id="map"><div id="tip" class="tip"></div></div>
<div id="info" data-term="ui_layout_map_label_click"></div>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js"></script>
<!-- the OpenLayers full build does not bundle the GeoTIFF reader: it expects the `GeoTIFF` global from geotiff.js -->
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>
<script src="dictionary.js"></script>
<script src="panes.js"></script>
<script src="service.js"></script>
<script>
// The view works in the Atlas rasters' native projection (ETRS89-LAEA, EPSG:3035), so the 1 km COGs are never
// warped; the OSM base tiles and the vectors (WGS84) are reprojected by OpenLayers.
proj4.defs('EPSG:3035', '+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs')
ol.proj.proj4.register(proj4)
const laea = ol.proj.get('EPSG:3035'); laea.setExtent([1896628.62, 1507846.05, 7104179.80, 6829874.45])   // EPSG:3035 projected bounds; the Atlas rasters span x 2.5–7.4 M, y 1.3–5.6 M
const FILES = '../', $ = (id) => document.getElementById(id), $K = (k) => document.querySelector(`[data-key="${k}"]`)   // the static host of the rasters: paths of the manifest are relative to it
const cogSource = (path) => new ol.source.GeoTIFF({ sources: [{ url: FILES + path }], normalize: false, interpolate: false })
const cog = (style) => new ol.layer.WebGLTile({ style, opacity: 0.85, visible: false })   // shown by applyLayers() once the state is known
// Atlas RPP: Float32 0…1 with −1 = uncertain / no data; MHS: 0…1; EU-Trees4F bin: 0/1 Int16 on the 10 km INSPIRE grid
const ramp = (from, to) => ['interpolate', ['linear'], ['band', 1], 0, [255, 255, 255, 0], 0.05, [...from, 0.25], 1, [...to, 1]]
const rpp = cog({ color: ['case', ['<', ['band', 1], 0], [0, 0, 0, 0], ramp([200, 230, 180], [26, 122, 26])] })
const mhs = cog({ color: ramp([200, 215, 240], [31, 78, 156]) })
// EU-Trees4F binary layers: the realised ("nat") variant exists for the current period only; future periods come
// as potential ("pot"), natural dispersal ("disp") and their land-use clips.
const bin = (rgba) => cog({ color: ['case', ['>=', ['band', 1], 1], rgba, [0, 0, 0, 0]] })
const t4cur = bin([255, 214, 0, 0.65]), t4fut = bin([233, 30, 99, 0.6])
const gj = new ol.format.GeoJSON({ dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3035' })
const choro = new ol.layer.Vector({ source: new ol.source.Vector(), style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#6a1b9a', width: 2.5, lineDash: [8, 5] }), fill: new ol.style.Fill({ color: 'rgba(106,27,154,.05)' }) }) })
// the user's drawn point or area, sent to the scatterplot pane (see linked.html)
const drawn = new ol.layer.Vector({ source: new ol.source.Vector(), style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#00897b', width: 2.5 }), fill: new ol.style.Fill({ color: 'rgba(0,137,123,.15)' }), image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#00897b' }), stroke: new ol.style.Stroke({ color: '#fff', width: 1.5 }) }) }) })
const unitStyle = new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#e06a00', width: 2 }), fill: new ol.style.Fill({ color: 'rgba(224,106,0,.25)' }), image: new ol.style.Circle({ radius: 4, fill: new ol.style.Fill({ color: '#e06a00' }), stroke: new ol.style.Stroke({ color: '#fff', width: 1 }) }) })
// flagged = the climate reference point lies farther than the threshold from the polygon (data quality): dark-red dashed outline
const flagStyle = new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#b71c1c', width: 2.5, lineDash: [6, 4] }), fill: new ol.style.Fill({ color: 'rgba(183,28,28,.2)' }), image: new ol.style.Circle({ radius: 5, fill: new ol.style.Fill({ color: '#b71c1c' }), stroke: new ol.style.Stroke({ color: '#fff', width: 1 }) }) })
const hidden = new ol.style.Style({})

// ---- the pane state, keyed by dictionary gids (ui_layout_state)
const K = { species: 'species', country: 'gcu_id_country', unit: 'gcu_id_number', flag: 'gcu_loc_climate_flag', level: 'gcu_loc_coordinates-restriction_level', base: 'ui_layout_map_layer_base', draw: 'ui_layout_map_draw-mode', sel: 'ui_layout_map_selection', period: 'env_climate_period', scenario: 'env_climate_scenario', variant: 'ui_layout_scatterplot_view_classes_variant', selection: 'ui_layout_scatterplot_units_selection' }
const LAYER = { rpp: 'ui_layout_map_layer_rpp', mhs: 'ui_layout_map_layer_mhs', t4cur: 'ui_layout_map_layer_t4-current', t4fut: 'ui_layout_map_layer_t4-future', choro: 'ui_layout_map_layer_chorology', units: 'ui_layout_map_layer_units' }
const E = (root, ...lids) => lids.map((l) => `${root}_${l}`)
const OPT = { [K.base]: E('ui_layout_map_layer_base', 'none', 'boundary', 'hillshade', 'gray', 'osm', 'topo'), [K.draw]: E('ui_layout_map_draw-mode', 'none', 'point', 'box', 'polygon'), [K.variant]: E('ui_layout_scatterplot_view_classes_variant', 'potential', 'dispersal') }
const run = { layers: '' }   // what the "i" mark reports: the species' map layers
const LBL = { selection: 'ui_layout_scatterplot_label_selection', restricted: 'ui_layout_label_restricted', flagged: 'ui_layout_label_flagged', unit: 'ui_layout_label_unit', neverOnMap: 'ui_layout_map_label_never-on-map', click: 'ui_layout_map_label_click', presence: 'ui_layout_map_label_presence', suitability: 'ui_layout_map_label_suitability', t4cur: 'ui_layout_map_label_t4-current', t4fut: 'ui_layout_map_label_t4-future', chorology: 'ui_layout_map_label_chorology', units: 'ui_layout_map_label_units', mapSel: 'ui_layout_scatterplot_label_map-selection' }
const DIST = 'gcu_loc_climate_distance'
const FUT = { '1991-2020': 'fut2035', '2021-2050': 'fut2065', '2051-2080': 'fut2095' }   // climate period → the EU-Trees4F map it drives (30-year lag)
let state = {}, cat, ix = []
const last = Dict.last
const flagged = (f) => f.get(DIST) != null && f.get(DIST) > state[K.flag]
// selected (option-click, here or in the scatterplot): the same black ring as in the scatterplot
const selRing = new ol.style.Style({ image: new ol.style.Circle({ radius: 7.5, stroke: new ol.style.Stroke({ color: '#111', width: 2 }) }) })
const selected = (id) => (state[K.selection] ?? []).includes(id)
const unitsStyle = (f) => f.get('hidden') ? hidden : selected(f.get('gcu_id_number')) ? [flagged(f) ? flagStyle : unitStyle, selRing] : flagged(f) ? flagStyle : unitStyle
const units = new ol.layer.Vector({ source: new ol.source.Vector(), style: unitsStyle })
const picked = new ol.layer.Vector({ source: new ol.source.Vector(), style: unitsStyle })   // the chosen unit's polygon, fetched on demand
const layers = { rpp, mhs, t4cur, t4fut, choro, units }
// base maps (raster tiles in Web Mercator, reprojected by OpenLayers to EPSG:3035), keyed by the element's last segment
const xyz = (url, attributions) => new ol.layer.Tile({ source: new ol.source.XYZ({ url, attributions, crossOrigin: 'anonymous', maxZoom: 17 }), opacity: 0.7 })
const basemaps = {
  boundary: new ol.layer.Vector({ source: new ol.source.Vector({ url: FILES + 'maps/basemap/ne_50m_admin_0_countries.geojson', format: new ol.format.GeoJSON({ dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3035' }) }),
    style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#8a8a8a', width: 0.8 }), fill: new ol.style.Fill({ color: '#f4f4f0' }) }), background: '#dfe9f3' }),
  gray: new ol.layer.Tile({ source: new ol.source.OSM({ crossOrigin: 'anonymous' }), opacity: 0.7, className: 'basemap-gray' }),
  topo: xyz('https://tile.opentopomap.org/{z}/{x}/{y}.png', '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)'),
  hillshade: xyz('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', 'Esri, USGS, NOAA'),
  osm: new ol.layer.Tile({ source: new ol.source.OSM(), opacity: 0.7 }),
}
const HOME = { center: ol.proj.fromLonLat([10, 50], laea), zoom: 4 }
const map = new ol.Map({ target: 'map', layers: [...Object.values(basemaps), ...Object.values(layers), picked, drawn],
  view: new ol.View({ projection: laea, ...HOME }) })
/** reset view: fit the species' visible units, else the initial view of Europe */
function resetView() {
  const shown = units.getSource().getFeatures().filter((f) => !f.get('hidden'))
  if (shown.length > 1) map.getView().fit(ol.extent.boundingExtent(shown.map((f) => f.getGeometry().getCoordinates())), { padding: [40, 40, 40, 40], maxZoom: 9, duration: 600 })
  else map.getView().animate({ ...HOME, duration: 600 })
}
/** the state → the map: base map, layer visibility and opacity */
function applyLayers() {
  for (const [k, l] of Object.entries(basemaps)) l.setVisible(k === last(state[K.base]))
  for (const [id, l] of Object.entries(layers)) { l.setVisible(!!state[LAYER[id]] && !!l.getSource()); l.setOpacity((state[LAYER[id] + '_opacity'] ?? 100) / 100) }   // a raster layer without a source is never rendered
  for (const el of document.querySelectorAll('.legend .tog')) el.classList.toggle('off', !state[el.dataset.toggle])   // the legend chips show and toggle the layers
}

// ---- species → map layers (from the service's manifest), units → vector layer of reference points; the search pane filters live
const t4futKey = () => { const c = cat.climates.find((k) => k[K.period] === state[K.period] && k[K.scenario] === state[K.scenario]); return c ? `${FUT[c.period]}|${c.scenario}|${Dict.aid(state[K.variant])}` : null }
async function showSpeciesLayers(name) {
  const e = await Svc.maps(name), T = Dict.title
  const set = (layer, gid, entry) => { layer.setSource(entry ? cogSource(entry.path) : null); $K(gid).parentElement.style.opacity = entry ? 1 : 0.4 }
  set(rpp, LAYER.rpp, e.atlas_rpp); set(mhs, LAYER.mhs, e.atlas_mhs); set(t4cur, LAYER.t4cur, e.eutrees4f['cur2005|cur|nat']); set(t4fut, LAYER.t4fut, e.eutrees4f[t4futKey()])
  applyLayers()
  choro.getSource().clear()
  for (const c of e.chorology.filter((c) => String(c.layer).startsWith('native range'))) fetch(FILES + c.path).then((r) => r.json()).then((g) => choro.getSource().addFeatures(gj.readFeatures(g)))
  run.layers = [e.atlas_rpp && T(LBL.presence), e.atlas_mhs && T(LBL.suitability), Object.keys(e.eutrees4f).length && `EU-Trees4F (${Object.keys(e.eutrees4f).length})`, e.chorology.length && T(LBL.chorology)].filter(Boolean).join(', ')
  const fc = await Svc.unitsGeo(state[K.level], { species: name })
  units.getSource().clear(); units.getSource().addFeatures(gj.readFeatures(fc))
  refill()
}
function refill() {
  const country = state[K.country] ? Dict.aid(state[K.country]) : '', species = state[K.species], T = Dict.title
  const match = (u, c, s) => (!c || u.gcu_id_number.startsWith(c)) && (!s || u.species_list.includes(s))
  const sel = ix.filter((u) => match(u, country, species))
  // facets: each list counts the units that match the OTHER selections (metadata-store behaviour)
  const count = (list, pick) => { const m = new Map(); for (const u of list) for (const k of [].concat(pick(u))) m.set(k, (m.get(k) ?? 0) + 1); return [...m].sort((a, b) => a[0].localeCompare(b[0])) }
  const cs = $K(K.country); cs.innerHTML = '<option value="">—</option>'; for (const [v, n] of count(ix.filter((u) => match(u, '', species)), (u) => u[K.country])) cs.add(new Option(`${T(v)} (${n})`, v, false, v === state[K.country]))
  const flagsOf = (s) => cat.species.find((x) => x.species === s)
  const ss = $K(K.species); ss.innerHTML = ''; for (const [v, n] of count(ix.filter((u) => match(u, country, '')), (u) => u.species_list)) ss.add(new Option(`${v}${flagsOf(v)?.atlas_rpp ? ' ●' : ''} (${n})`, v, false, v === species))
  const us = $K(K.unit); us.innerHTML = '<option value="">—</option>'
  const flag = (u) => u[DIST] != null && u[DIST] > state[K.flag]
  for (const u of sel) us.add(new Option(u.gcu_id_number + (u['gcu_loc_coordinates-restriction'] ? ` (${T(LBL.restricted)})` : '') + (flag(u) ? ` ⚠ ${u[DIST].toFixed(0)} km` : ''), u.gcu_id_number, false, u.gcu_id_number === state[K.unit]))
  for (const el of [cs, ss, us]) Dict.hover(el)
  const nf = sel.filter(flag).length; $('searchInfo').textContent = `${sel.length} ${T(LBL.unit).toLowerCase()}s · ${sel.filter((u) => u['gcu_loc_coordinates-restriction']).length} ${T(LBL.restricted)}${nf ? ` · ⚠ ${nf}` : ''} · ● ${T(LBL.presence)}`; $('searchInfo').title = `⚠ = ${T(LBL.flagged)} (> ${state[K.flag]} km)`
  const ids = new Set(sel.map((u) => u.gcu_id_number))
  for (const f of units.getSource().getFeatures()) f.set('hidden', !ids.has(f.get('gcu_id_number')), true)   // the points outside the filter are not drawn
  units.changed()
  run.sel = sel; updateInfo(sel)
}
/** the "i" mark: the species as heading, then its map layers, the country and the unit when chosen, the counts */
function updateInfo(sel) {
  const T = Dict.title, u = state[K.unit] && ix.find((x) => x.gcu_id_number === state[K.unit])
  const lines = [run.layers, state[K.country] && `${T('ui_layout_label_country')}: ${T(state[K.country])}`,
    u && `${T(LBL.unit)}: ${u.gcu_id_number}${u['gcu_loc_coordinates-restriction'] ? ` (${T(LBL.restricted)})` : ''}${u[DIST] > state[K.flag] ? ` ⚠ ${u[DIST].toFixed(0)} km` : ''}`,
    `${sel.length} ${T(LBL.unit).toLowerCase()}s, ${sel.filter((x) => x['gcu_loc_coordinates-restriction']).length} ${T(LBL.restricted)}, ${sel.filter((x) => x[DIST] > state[K.flag]).length} ${T(LBL.flagged)}, ${(state[K.selection] ?? []).length} ${T(LBL.selection).toLowerCase()}`]
  Pop.set($('status'), lines.filter(Boolean).join(' · '), state[K.species])
}
async function goToUnit() {
  picked.getSource().clear()
  if (!state[K.unit]) return
  const fc = await Svc.unitsGeo(state[K.level], { [K.unit]: state[K.unit] })
  if (fc.withheld || !fc.features.length) { $('info').textContent = `${state[K.unit]}: ${Dict.title(LBL.neverOnMap)}`; return }
  const feats = gj.readFeatures(fc); picked.getSource().addFeatures(feats)
  map.getView().fit(feats[0].getGeometry().getExtent(), { padding: [60, 60, 60, 60], maxZoom: 11, duration: 600 })
}
// ---- controls bound to state keys
const read = (el) => el.type === 'checkbox' ? el.checked : el.type === 'range' || el.dataset.key === K.flag ? Number(el.value) : (el.value === '' ? null : el.value)
const ON = {
  [K.species]: () => { state[K.country] = null; state[K.unit] = null; showSpeciesLayers(state[K.species]); post({ [K.species]: state[K.species] }) },
  [K.country]: () => { state[K.unit] = null; refill() }, [K.unit]: () => { goToUnit(); refill() }, [K.flag]: () => { refill(); units.changed() },
  [K.draw]: setDraw, [K.base]: applyLayers, [K.variant]: () => showSpeciesLayers(state[K.species]),
}
function bindControls() {
  for (const el of document.querySelectorAll('[data-key]')) {
    const k = el.dataset.key
    if (el.tagName === 'SELECT') { el.dataset.fieldDef = Dict.def(k); if (OPT[k]) Dict.options(el, OPT[k], state[k]); else Dict.hover(el) }
    else el.title ||= Dict.def(k)
    el.addEventListener(el.type === 'range' ? 'input' : 'change', () => { state[k] = read(el); (ON[k] ?? applyLayers)() })
  }
  // the EU-Trees4F future layer: period × scenario of the EU-Trees4F futures, as one selector (the period term's definition as hover)
  const t4 = $('t4period'); t4.innerHTML = ''
  for (const c of cat.climates.filter((k) => k.src === 'eutrees4f' && !k.present)) { const o = new Option(`${Dict.title(c[K.period])} · ${Dict.title(c[K.scenario])}`, c.key, false, c[K.period] === state[K.period] && c[K.scenario] === state[K.scenario]); o.title = Dict.def(c[K.period]); t4.add(o) }
  t4.dataset.fieldDef = Dict.def(K.period); Dict.hover(t4)
  t4.addEventListener('change', (e) => { const c = cat.climates.find((k) => k.key === e.target.value); state[K.period] = c[K.period]; state[K.scenario] = c[K.scenario]; showSpeciesLayers(state[K.species]) })
}
function syncControls() { for (const el of document.querySelectorAll('[data-key]')) { const v = state[el.dataset.key]; if (el.type === 'checkbox') el.checked = !!v; else if (v != null) el.value = v } }
// ---- map → scatterplot: the drawn geometry (WGS84 GeoJSON) goes to the parent page as ui_layout_map_selection
const post = (partial) => { const msg = { type: 'state', ...partial }; if (window.parent !== window) window.parent.postMessage(msg, '*'); if (window.opener) window.opener.postMessage(msg, '*') }
const wgs = new ol.format.GeoJSON({ dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3035' })
let drawInt = null
function setDraw() {   // changing the mode clears the drawing on both panes
  if (drawInt) { map.removeInteraction(drawInt); drawInt = null }
  drawn.getSource().clear(); state[K.sel] = null; post({ [K.sel]: null })
  const v = last(state[K.draw]); if (v === 'none') return
  const type = { point: 'Point', box: 'Circle', polygon: 'Polygon' }[v]
  drawInt = new ol.interaction.Draw({ source: drawn.getSource(), type, geometryFunction: v === 'box' ? ol.interaction.Draw.createBox() : undefined })
  drawInt.on('drawstart', () => drawn.getSource().clear())
  drawInt.on('drawend', (ev) => { const g = JSON.parse(wgs.writeGeometry(ev.feature.getGeometry())); state[K.sel] = g; post({ [K.sel]: g }); $('info').textContent = `${g.type} → ${Dict.title(LBL.mapSel)}` })
  map.addInteraction(drawInt)
}
// ---- units under the pointer: the hover window, option-click = toggle in the selection, click = choose the unit
const unitAt = (pixel) => map.forEachFeatureAtPixel(pixel, (f) => f, { layerFilter: (l) => l === units || l === picked, hitTolerance: 4 })
const unitHtml = (f) => { const T = Dict.title, id = f.get('gcu_id_number'); return `<b>${id}</b>${f.get('gcu_loc_coordinates-restriction') ? ` (${T(LBL.restricted)})` : ''}${flagged(f) ? `<br><span style="color:#b71c1c">⚠ ${T(LBL.flagged)}: ${f.get(DIST).toFixed(1)} km</span>` : ''}<br>${f.get('species_list').join(', ')}<br>${T('ISO_3166_1_' + id.slice(0, 3))}` }
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state[K.unit]) { state[K.unit] = null; picked.getSource().clear(); syncControls(); refill(); post({ [K.unit]: null }) } })
map.on('pointermove', (e) => {
  const f = e.dragging ? null : unitAt(e.pixel), tip = $('tip')
  map.getTargetElement().style.cursor = f ? 'pointer' : ''
  if (!f) { tip.style.display = 'none'; return }
  tip.innerHTML = unitHtml(f); tip.style.display = 'block'; tip.style.left = Math.min(e.pixel[0] + 14, map.getSize()[0] - 220) + 'px'; tip.style.top = e.pixel[1] + 14 + 'px'
})
map.on('singleclick', (e) => {
  if (drawInt) return
  const [lon, lat] = ol.proj.toLonLat(e.coordinate, laea), T = Dict.title
  const f = unitAt(e.pixel)
  if (f && e.originalEvent.altKey) {   // toggle in the shared selection
    const id = f.get('gcu_id_number'), sel = state[K.selection] ?? []
    state[K.selection] = selected(id) ? sel.filter((x) => x !== id) : [...sel, id]
    units.changed(); picked.changed(); post({ [K.selection]: state[K.selection] }); updateInfo(run.sel ?? []); $('info').innerHTML = `${T(LBL.selection)}: ${state[K.selection].length} · ${unitHtml(f).replace(/<br>/g, ' · ')}`
    return
  }
  if (f) {   // choose the unit: its polygon here, its reference point in the scatterplot (through the host)
    const id = f.get('gcu_id_number')
    if (state[K.unit] !== id) { state[K.unit] = id; syncControls(); goToUnit(); refill() }
    post({ [K.unit]: id }); $('info').innerHTML = unitHtml(f).replace(/<br>/g, ' · ')
    return
  }
  drawn.getSource().clear(); drawn.getSource().addFeature(new ol.Feature(new ol.geom.Point(e.coordinate)))
  state[K.sel] = { type: 'Point', coordinates: [lon, lat] }; post({ [K.sel]: state[K.sel] })
  const read = (l) => { if (!l.getSource()) return null; const d = l.getData(e.pixel); return d ? d[0] : null }
  const parts = [`<b>${lat.toFixed(4)}, ${lon.toFixed(4)}</b>`]
  for (const [g, l] of [[LBL.presence, rpp], [LBL.suitability, mhs], [LBL.t4cur, t4cur], [LBL.t4fut, t4fut]]) { const v = read(l); if (v != null && l.getVisible()) parts.push(`${T(g)}: ${v < 0 ? '—' : v.toFixed(2)}`) }
  $('info').innerHTML = parts.join(' · ')
})
// the host page's state arrives as messages; a cleared selection from the host or the scatterplot clears the drawing without echo
window.addEventListener('message', async (e) => {
  if (e.data?.type !== 'state' || !cat) return
  const p = e.data, speciesChanged = p[K.species] && p[K.species] !== state[K.species], levelChanged = K.level in p && p[K.level] !== state[K.level], unitChanged = K.unit in p && p[K.unit] !== state[K.unit]
  for (const [k, v] of Object.entries(p)) if (k !== 'type') state[k] = v
  if (K.sel in p && !p[K.sel]) drawn.getSource().clear()
  if (K.selection in p) { units.changed(); picked.changed() }
  syncControls(); applyLayers()
  if (levelChanged) ix = await Svc.unitsIndex(state[K.level])
  if (speciesChanged || levelChanged) await showSpeciesLayers(state[K.species]); else refill()
  if (unitChanged) goToUnit()   // the chosen unit's polygon (cleared when null)
})
// ---- start: the dictionary's defaults, then the URL (any state key by its gid), then the service
const parse = (v) => { if (v === 'true') return true; if (v === 'false') return false; if (/^[\[{]/.test(v)) { try { return JSON.parse(v) } catch { return v } } return v !== '' && !isNaN(v) ? Number(v) : v }
Promise.all([Svc.catalogue(), Dict.defaults()]).then(async ([c, defaults]) => {
  cat = c
  const t4 = c.climates.find((k) => k.src === 'eutrees4f' && k.period === '2051-2080' && k.scenario === 'rcp85') ?? c.climates.find((k) => k.src === 'eutrees4f' && !k.present)
  state = { ...defaults, [K.species]: 'Fagus sylvatica', [K.period]: t4[K.period], [K.scenario]: t4[K.scenario], [K.variant]: OPT[K.variant][1] }   // the future layer shown by default: 2095, RCP 8.5, natural dispersal
  const q = new URLSearchParams(location.search)
  for (const k of [...Object.values(K), ...Object.values(LAYER), ...Object.values(LAYER).map((l) => l + '_opacity')]) if (q.has(k)) state[k] = parse(q.get(k))
  if (q.get('embedded')) document.body.classList.add('embedded')
  if (q.get('settings')) document.body.classList.add('settings')   // the drawing settings open at load (dev and presets)
  ix = await Svc.unitsIndex(state[K.level])
  await Dict.load([...Object.values(K), ...Object.values(LAYER), ...Object.values(LAYER).map((l) => l + '_opacity'), ...Object.values(OPT).flat(), ...Object.values(LBL), ...c.countries.map((x) => x[K.country]), ...c.climates.filter((k) => k.src === 'eutrees4f').flatMap((k) => [k[K.period], k[K.scenario]]), 'ui_layout_map', 'ui_layout_map_layer', 'ui_layout_label_unit', 'ui_layout_label_flagged', 'ui_layout_label_clear', 'ui_layout_label_species', 'ui_layout_label_country', DIST])
  await Dict.labels(); Pop.shortLabels(); bindControls(); syncControls(); applyLayers()
  await showSpeciesLayers(state[K.species])
  $('drawClear').addEventListener('click', () => { drawn.getSource().clear(); state[K.sel] = null; post({ [K.sel]: null }) })
  for (const el of document.querySelectorAll('.legend .tog')) { el.title = Dict.def(el.dataset.toggle); el.addEventListener('click', () => { state[el.dataset.toggle] = !state[el.dataset.toggle]; syncControls(); applyLayers() }) }
  $('settings').addEventListener('click', () => document.body.classList.toggle('settings')); Pop.bind($('status'))
  $('reset').addEventListener('click', resetView)
}).catch((e) => { $('info').textContent = `service unavailable: ${e.message} (${Svc.BASE})`; Pop.set($('status'), $('info').textContent) })
</script>
