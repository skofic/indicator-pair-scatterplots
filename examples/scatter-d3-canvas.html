<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scatterplot — D3 + Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="panes.css">
<style>
  #wrap { position: relative; flex: 1 1 auto; min-height: 320px; margin: 4px 10px; overflow: hidden; cursor: crosshair }
  canvas, svg { position: absolute; left: 0; top: 0 }
  svg, #over { pointer-events: none }
  .grid line { stroke: #000; stroke-opacity: .06 } .grid path { display: none }
  #disabled { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.82); color: #555; font-size: 15px; text-align: center; padding: 24px; z-index: 3 }
  body.disabled #disabled { display: flex }
  body.busy #wrap { opacity: .55; pointer-events: none }   /* the plot waits for the service with the controls */
</style>
</head>
<body>
<!-- Every label is a dictionary term (data-term: text = _title, hover = _definition); every control is bound to a key of
     the pane state (data-key = the term's gid), whose values are the gids of the enumeration elements. The data comes
     from the panes' Foxx service (service.js), the texts from the dictionary service (dictionary.js). -->
<!-- the legend row first, on both panes: the marks ("i" status, "?" hints, reset view, the hourglass while waiting), then the chips (Milko, 2026-11-12) -->
<div class="legend"><span class="info" id="status">i</span><span class="help" id="help">?</span><span class="reset" id="reset" tabindex="0">↺</span><span class="wait">⏳</span><span id="legend"></span></div>
<div class="toolbar">
  <strong class="pane-title" data-term="ui_layout_scatterplot"></strong>
  <span class="group"><span class="cap" data-term="env_climate"></span>
    <label><span data-term="ui_layout_label_source"></span> <select id="product" class="wide"></select></label>
    <label><span data-term="env_climate_scenario"></span> <select data-key="env_climate_scenario"></select></label>
    <label><span data-term="env_climate_period"></span> <select data-key="env_climate_period"></select></label>
  </span>
  <span class="group"><span class="cap">X · Y</span>
    <label><span data-term="ui_layout_scatterplot_X"></span> <select data-key="ui_layout_scatterplot_X"></select></label>
    <label><span data-term="ui_layout_scatterplot_Y"></span> <select data-key="ui_layout_scatterplot_Y"></select></label>
  </span>
  <span class="group" id="viewCtl"><span class="cap" data-term="ui_layout_scatterplot_view"></span><select data-key="ui_layout_scatterplot_view"></select></span>
  <span class="group" id="classCtl" style="display:none"><span class="cap" data-term="ui_layout_scatterplot_view_classes"></span>
    <label><span data-term="ui_layout_scatterplot_view_classes_variant"></span> <select data-key="ui_layout_scatterplot_view_classes_variant"></select></label>
    <label><span data-term="ui_layout_scatterplot_view_classes_position"></span> <select data-key="ui_layout_scatterplot_view_classes_position"></select></label>
    <label><span data-term="ui_layout_scatterplot_view_classes_bin"></span> <select data-key="ui_layout_scatterplot_view_classes_bin"></select> ≥ <select data-key="ui_layout_scatterplot_view_classes_bin_min"><option>10</option><option>30</option><option>100</option><option>300</option></select></label>
  </span>
  <span class="group"><button id="settings" class="toggle" data-term="ui_layout_scatterplot_layer"></button></span>
</div>
<!-- the drawing settings: one group per layer, then the settings shared by the layers; a group never breaks across rows -->
<div class="toolbar collapsible">
  <span class="group"><span class="cap" data-term="ui_layout_scatterplot_base"></span>
    <label><span data-term="ui_layout_scatterplot_base_mode"></span> <select data-key="ui_layout_scatterplot_base_mode"></select></label>
    <label><span data-term="ui_layout_scatterplot_base_opacity"></span> <input type="range" data-key="ui_layout_scatterplot_base_opacity" min="0" max="100"></label>
    <label id="basePosCtl"><span data-term="ui_layout_scatterplot_base_position"></span> <select data-key="ui_layout_scatterplot_base_position"></select></label>
  </span>
  <span class="group"><span class="cap" data-term="ui_layout_scatterplot_species"></span>
    <label><span data-term="ui_layout_scatterplot_species_mode"></span> <select data-key="ui_layout_scatterplot_species_mode"></select></label>
    <label><span data-term="ui_layout_scatterplot_species_opacity"></span> <input type="range" data-key="ui_layout_scatterplot_species_opacity" min="0" max="100"></label>
    <label><input type="checkbox" data-key="ui_layout_scatterplot_species_envelope"> <span data-term="ui_layout_scatterplot_species_envelope"></span></label>
  </span>
  <span class="group"><span class="cap" data-term="ui_layout_scatterplot_units"></span>
    <label><span data-term="ui_layout_scatterplot_units_opacity"></span> <input type="range" data-key="ui_layout_scatterplot_units_opacity" min="0" max="100"></label>
    <label><input type="checkbox" data-key="ui_layout_scatterplot_layer_arrows"> <span data-term="ui_layout_scatterplot_layer_arrows"></span></label>
  </span>
  <span class="group"><span class="cap" data-term="ui_layout_scatterplot_layer"></span>
    <label><span data-term="ui_layout_scatterplot_layer_radius"></span> <input type="range" data-key="ui_layout_scatterplot_layer_radius" min="2" max="10"></label>
  </span>
</div>
<div class="toolbar secondary" id="search">
  <span class="group host"><span class="cap" data-term="ui_layout_label_unit"></span>
    <label><span data-term="ui_layout_label_species"></span> <select data-key="species"></select></label>
    <label><span data-term="ui_layout_label_country"></span> <select data-key="gcu_id_country"></select></label>
    <label><span data-term="ui_layout_label_unit"></span> <select data-key="gcu_id_number"></select></label>
    <span id="searchInfo" class="hints"></span>
  </span>
  <span class="group host"><span class="cap" data-term="gcu_loc_coordinates-restriction"></span>
    <label><span data-term="gcu_loc_coordinates-restriction_level"></span> <select data-key="gcu_loc_coordinates-restriction_level"></select></label>
    <label><span data-term="gcu_loc_climate_flag"></span> &gt; <select data-key="gcu_loc_climate_flag"><option>1</option><option>2</option><option>5</option><option>10</option><option>20</option></select> km</label>
  </span>
  <span class="group host"><span class="cap" data-term="ui_layout_units_selection"></span>
    <span id="selCount">0</span> <select data-key="ui_layout_units_mode"></select> <button id="selClear" data-term="ui_layout_label_clear"></button>
  </span>
  <span class="group" id="mapSel" style="display:none"><span class="cap" data-term="ui_layout_scatterplot_label_map-selection"></span><span id="mapSelInfo"></span> <button id="mapSelClear" data-term="ui_layout_label_clear"></button></span>
  <span class="group"><span class="cap" data-term="ui_layout_scatterplot_cursor"></span><label><input type="checkbox" data-key="ui_layout_scatterplot_cursor"> <span id="cursorInfo" class="hints"></span></label></span>
</div>
<div id="wrap"><canvas id="c"></canvas><canvas id="over"></canvas><svg id="s"></svg><div id="tip" class="tip"></div><div id="disabled"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-hexbin/0.2.2/d3-hexbin.min.js"></script>
<script src="dictionary.js"></script>
<script src="panes.js"></script>
<script src="service.js"></script>
<script>
const $ = (id) => document.getElementById(id), $K = (k) => document.querySelector(`[data-key="${k}"]`), css = (v) => getComputedStyle(document.body).getPropertyValue(v)
const M = { top: 10, right: 16, bottom: 44, left: 62 }
const wrap = $('wrap'), canvas = $('c'), over = $('over'), svg = d3.select('#s'), tip = $('tip'), status = $('status'), ctx = canvas.getContext('2d'), octx = over.getContext('2d')
let W = 0, H = 0, tx = d3.zoomIdentity
const x0 = d3.scaleLinear(), y0 = d3.scaleLinear()
const gGX = svg.append('g').attr('class', 'grid'), gGY = svg.append('g').attr('class', 'grid'), gX = svg.append('g'), gY = svg.append('g'), xl = svg.append('text').attr('text-anchor', 'middle'), yl = svg.append('text').attr('text-anchor', 'middle')

// ---- the pane state: one object keyed by dictionary gids (ui_layout_state); its values are element gids, numbers,
// booleans, arrays; it is what a deep link, a message from the host page, a preset view and a service request carry
const K = {
  species: 'species', country: 'gcu_id_country', unit: 'gcu_id_number', level: 'gcu_loc_coordinates-restriction_level', flag: 'gcu_loc_climate_flag',
  dataset: 'std_dataset_ids', scenario: 'env_climate_scenario', period: 'env_climate_period', X: 'ui_layout_scatterplot_X', Y: 'ui_layout_scatterplot_Y',
  view: 'ui_layout_scatterplot_view', baseMode: 'ui_layout_scatterplot_base_mode', baseOp: 'ui_layout_scatterplot_base_opacity', basePos: 'ui_layout_scatterplot_base_position',
  speciesMode: 'ui_layout_scatterplot_species_mode', speciesOp: 'ui_layout_scatterplot_species_opacity', envelope: 'ui_layout_scatterplot_species_envelope',
  unitsMode: 'ui_layout_units_mode', unitsOp: 'ui_layout_scatterplot_units_opacity', selection: 'ui_layout_units_selection',
  radius: 'ui_layout_scatterplot_layer_radius', arrows: 'ui_layout_scatterplot_layer_arrows', zoom: 'ui_layout_scatterplot_zoom',
  variant: 'ui_layout_scatterplot_view_classes_variant', position: 'ui_layout_scatterplot_view_classes_position', bin: 'ui_layout_scatterplot_view_classes_bin', binMin: 'ui_layout_scatterplot_view_classes_bin_min',
  mapSel: 'ui_layout_map_selection', cursor: 'ui_layout_scatterplot_cursor',
}
const E = (root, ...lids) => lids.map((l) => `${root}_${l}`)   // the elements of an enumeration, in display order
// what this pane remembers between visits (browser storage): the climate, the pair, the views and every drawing setting — not the filter, the selections or the zoom
const REMEMBER = [K.dataset, K.period, K.scenario, K.X, K.Y, K.view, K.variant, K.position, K.bin, K.binMin, K.baseMode, K.baseOp, K.basePos, K.speciesMode, K.speciesOp, K.envelope, K.unitsMode, K.unitsOp, K.radius, K.arrows, K.flag, K.cursor]
const OPT = {
  [K.view]: E('ui_layout_scatterplot_view', 'layer', 'classes'),
  [K.baseMode]: E('ui_layout_scatterplot_base', 'point', 'hex', 'none'),
  [K.basePos]: E('ui_layout_scatterplot_base_position', 'present', 'future'),
  [K.speciesMode]: E('ui_layout_scatterplot_species', 'point', 'hex', 'none'),
  [K.unitsMode]: E('ui_layout_units', 'all', 'only', 'hide'),
  [K.level]: E('gcu_loc_coordinates-restriction', 'public', 'value', 'manage'),
  [K.variant]: E('ui_layout_scatterplot_view_classes_variant', 'potential', 'dispersal'),
  [K.position]: E('ui_layout_scatterplot_view_classes_position', 'present', 'future'),
  [K.bin]: E('ui_layout_scatterplot_view_classes_bin', '0-5x50', '1x100', '2x200'),
}
const LEGEND = E('ui_layout_scatterplot_view_classes_legend', '0', '1', '2', '3')
const LBL = { base: 'ui_layout_scatterplot_label_base', species: 'ui_layout_scatterplot_label_species', unitsPresent: 'ui_layout_scatterplot_label_units-present', unitsFuture: 'ui_layout_scatterplot_label_units-future', mapSel: 'ui_layout_scatterplot_label_map-selection', envPresent: 'ui_layout_scatterplot_label_envelope-present', binArrows: 'ui_layout_scatterplot_label_bin-arrows', projection: 'ui_layout_scatterplot_label_projection', restricted: 'ui_layout_label_restricted', flagged: 'ui_layout_label_flagged', noData: 'ui_layout_label_no-data', unit: 'ui_layout_label_unit' }
const DIST = 'gcu_loc_climate_distance'   // the unit fact the flag is read from
const NUMERIC = new Set([K.flag, K.binMin, K.radius, K.baseOp, K.speciesOp, K.unitsOp])
let state = {}
const last = Dict.last, is = (k, lid) => last(state[k]) === lid   // is(K.baseMode, 'hex')

// ---- data: everything comes from the service in the global cell order (base = the pair per cell, null where absent;
// species = index list; selection = index list); the present base is kept for the arrows and the fixed reference layers
const run = { mapIdx: [], mapLabel: '', point: null }
let cat, climates, units = [], base = [], basePresent = [], speciesIdx = [], species = [], speciesPresent = [], quad, domainKey = null
let classes = ''   // class view: one class digit per cell
const pts = (idx, b) => { const o = []; for (const i of idx) if (b[i]) o.push(b[i]); return o }
const CLASS_VAR = { 1: '--stable', 2: '--lost', 3: '--new' }
const FUT_MAP = { '1991-2020': '2035', '2021-2050': '2065', '2051-2080': '2095' }   // EU-Trees4F: the map centred on a year is driven by the climate of the previous 30 years
const busy = () => status.classList.add('busy')
const setStatus = (text) => { status.classList.remove('busy'); Pop.set(status, text) }

// ---- the climate: the state holds a dataset key, a scenario gid and a period gid; the catalogue maps them to climates
const cur = () => climates.find((k) => k[K.dataset] === state[K.dataset]?.[0] && k[K.scenario] === state[K.scenario] && k[K.period] === state[K.period])
const presentOf = (c) => climates.find((k) => k[K.dataset] === c[K.dataset] && k.present)
const setClimate = (c) => { state[K.dataset] = [c[K.dataset]]; state[K.scenario] = c[K.scenario]; state[K.period] = c[K.period] }
const stateFor = (c) => ({ ...state, [K.dataset]: [c[K.dataset]], [K.period]: c[K.period], [K.scenario]: c[K.scenario] })
const classView = () => { const c = cur(); return is(K.view, 'classes') && c.src === 'eutrees4f' && !c.present }
/** the three-level selector: source → scenario → period, never across sources; the axis selectors */
function fillClimate() {
  const c = cur(), prod = $('product'), sc = $K(K.scenario), pe = $K(K.period)
  prod.innerHTML = ''; for (const d of cat.datasets) { const o = new Option(d.title, d[K.dataset], false, d[K.dataset] === c[K.dataset]); if (d.definition) o.title = Dict.plain(d.definition); prod.add(o) }
  Dict.hover(prod)
  Dict.options(sc, [...new Set(climates.filter((k) => k[K.dataset] === c[K.dataset]).map((k) => k[K.scenario]))], c[K.scenario])
  Dict.options(pe, climates.filter((k) => k[K.dataset] === c[K.dataset] && k[K.scenario] === c[K.scenario]).map((k) => k[K.period]), c[K.period])
  Dict.options($K(K.X), cat.axes[K.X], state[K.X]); Dict.options($K(K.Y), cat.axes[K.Y], state[K.Y])
  for (const sel of [$K(K.X), $K(K.Y)]) for (const o of sel.options) o.text = axisLabel(o.value)
}
const axisLabel = (g) => Dict.title(g) + (Dict.unit(g) ? ` (${Dict.unit(g)})` : '')
const fmt = (v) => Number(v).toFixed(Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2)
const ELEV = 'geo_shape_elevation'   // the unit polygon's mean elevation (with gcu_loc_elevation-min / -max) and, for a map point, the WorldClim elevation layer — both from the service (2026-11-12)
const elevation = (u) => u[ELEV] == null ? '' : `<br>${Dict.title(ELEV)}: ${Math.round(u[ELEV])} ${Dict.unit(ELEV)}` + (u['gcu_loc_elevation-min'] != null ? ` (${u['gcu_loc_elevation-min']}–${u['gcu_loc_elevation-max']})` : '')
function size() {
  W = wrap.clientWidth; H = wrap.clientHeight
  for (const [cv, cx] of [[canvas, ctx], [over, octx]]) { cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; cv.style.width = W + 'px'; cv.style.height = H + 'px'; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0) }
  svg.attr('width', W).attr('height', H)
  x0.range([M.left, W - M.right]); y0.range([H - M.bottom, M.top])
  xl.attr('x', (M.left + W - M.right) / 2).attr('y', H - 8).text(axisLabel(state[K.X])); yl.attr('transform', `translate(13,${(M.top + H - M.bottom) / 2}) rotate(-90)`).text(axisLabel(state[K.Y]))
}
/** the axes are fixed per source and pair from its present base, padded for the future shift (more on the right, where warming goes), and never move on a period change */
function fixDomain(presentBase) {
  const xe = d3.extent(presentBase, (d) => d?.[0]), ye = d3.extent(presentBase, (d) => d?.[1])
  const xr = xe[1] - xe[0], yr = ye[1] - ye[0]
  x0.domain([xe[0] - 0.05 * xr, xe[1] + 0.25 * xr]).nice(); y0.domain([ye[0] > 0 ? 0 : ye[0] - 0.1 * yr, ye[1] + 0.1 * yr]).nice()
}
async function refresh() {
  const c = cur(), p = presentOf(c), sp = state[K.species]
  busy()
  base = await Svc.base(state); basePresent = c.present ? base : await Svc.base(stateFor(p))
  speciesIdx = sp ? await Svc.speciesCells(sp) : []   // no species: the base and every unit the level allows (the empty state, 2026-11-12)
  species = pts(speciesIdx, base); speciesPresent = c.present ? species : pts(speciesIdx, basePresent)
  units = await Svc.units(sp, state, state[K.level])
  await Dict.load(units.map((u) => 'ISO_3166_1_' + u.gcu_id_number.slice(0, 3)))   // country names for the list
  const dk = `${c[K.dataset]}|${state[K.X]}|${state[K.Y]}`
  if (domainKey !== dk) { fixDomain(basePresent); domainKey = dk; tx = d3.zoomIdentity; state[K.zoom] = null; size() }
  const avail = c.src === 'eutrees4f' && !c.present, view = $K(K.view)
  view.options[1].disabled = !avail; if (!avail && is(K.view, 'classes')) { state[K.view] = OPT[K.view][0]; view.value = state[K.view] }
  view.options[1].text = Dict.title(OPT[K.view][1]) + (avail ? '' : ' — EU-Trees4F, future period')
  $('classCtl').style.display = classView() ? '' : 'none'
  $('viewCtl').style.display = cur()?.src === 'eutrees4f' ? '' : 'none'   // the suitability-classes view exists for EU-Trees4F only: no single-choice selector for the other sources (Milko, 2026-11-12)
  $('basePosCtl').style.display = !c.present && !classView() ? '' : 'none'
  classes = ''
  if (classView() && sp) { const r = await Svc.classes(sp, state, state[K.variant]); classes = r ? r.cells : '' }
  const T = Dict.title   // legend chips: a swatch and the term's title; the three layers' chips toggle the layer
  const chip = (v, text, tog) => `<span${tog ? ` class="tog${layerOff(tog) ? ' off' : ''}" data-toggle="${tog}" title="${T('ui_layout_scatterplot_layer')}"` : ''}><span class="sw" style="${v.startsWith('--') ? `background:var(${v})` : v}"></span>${text}</span>`
  $('legend').innerHTML = (classView()
    ? `${chip('--base', T(LBL.base), 'base')}${chip('--stable', T(LEGEND[1]))}${chip('--lost', T(LEGEND[2]))}${chip('--new', T(LEGEND[3]))}${chip('--unit', T(LBL.unitsPresent), 'units')}${chip('--future', T(LBL.unitsFuture))}${chip('--map', T(LBL.mapSel))}<span class="note">· ${T(LBL.binArrows)}</span>`
    : `${chip('--base', T(LBL.base) + (c.present ? '' : ` (${T(state[K.basePos]).toLowerCase()})`), 'base')}${chip('--species', T(LBL.species) + (c.present ? '' : ` (${T(LBL.unitsPresent).split(',').pop().trim()})`), 'species')}${chip('--unit', T(LBL.unitsPresent), 'units')}${chip('--future', T(LBL.unitsFuture))}${chip('--map', T(LBL.mapSel))}${chip('border:1.5px dashed var(--flag);background:none;width:8px;height:8px', T(LBL.flagged))}`)
    + (c.present ? '' : `<span class="note">· ${T(LBL.projection)}: ${T(LBL.unitsFuture)}, ${T(LBL.mapSel)}</span>`)
  for (const el of $('legend').querySelectorAll('.tog')) el.addEventListener('click', () => { toggleLayer(el.dataset.toggle); remember() })
  fillClimate(); refill(); syncControls()
  if (state[K.mapSel]) await selectFromMap(state[K.mapSel], { quiet: true })
  draw()
}
const remember = () => Store.save('scatter', state, REMEMBER)
/** the legend toggles: base and species switch their drawing mode to hidden and back, units switch their opacity */
const layerOff = (l) => l === 'base' ? is(K.baseMode, 'none') : l === 'species' ? is(K.speciesMode, 'none') : state[K.unitsOp] === 0
const remembered = {}
function toggleLayer(l) {
  if (l === 'units') { if (state[K.unitsOp] > 0) { remembered.units = state[K.unitsOp]; state[K.unitsOp] = 0 } else state[K.unitsOp] = remembered.units || 100 }
  else { const k = l === 'base' ? K.baseMode : K.speciesMode, none = OPT[k][2]; if (state[k] === none) state[k] = remembered[l] ?? OPT[k][0]; else { remembered[l] = state[k]; state[k] = none } }
  syncControls(); draw(); for (const el of $('legend').querySelectorAll('.tog')) el.classList.toggle('off', layerOff(el.dataset.toggle))
}
const unitXY = (u, c) => u.values[c.key]
const unitPos = (u) => classView() ? unitXY(u, presentOf(cur())) : unitXY(u, cur())
const flagged = (u) => u[DIST] != null && u[DIST] > state[K.flag]
const selected = (id) => (state[K.selection] ?? []).includes(id)
function visibleUnits() {
  const c = cur(), country = state[K.country] ? Dict.aid(state[K.country]) : ''
  return units.filter((u) => (!country || u.gcu_id_number.startsWith(country)) && unitXY(u, c)   // the chosen unit is a highlight, never a filter (decided 2026-11-10)
    && (is(K.unitsMode, 'all') || (is(K.unitsMode, 'only') ? selected(u.gcu_id_number) : !selected(u.gcu_id_number))))
}
function arrow(ax, ay, bx, by, w, head) {
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke()
  const ang = Math.atan2(by - ay, bx - ax); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - head * Math.cos(ang - 0.4), by - head * Math.sin(ang - 0.4)); ctx.lineTo(bx - head * Math.cos(ang + 0.4), by - head * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill()
}
/** EU-Trees4F Figure 1: every cell coloured by its suitability class (current binary map vs the selected period's), the
 *  cells drawn at their present or future pair values; arrows = mean shift present → future of the species' current
 *  envelope (classes stable + decolonised) per climate bin, the thick arrow for the whole envelope */
function drawClasses(x, y, drawHex, r, op) {
  if (is(K.baseMode, 'hex')) drawHex(basePresent.filter(Boolean).concat(base.filter(Boolean)), r, (t) => d3.interpolateGreys(0.15 + 0.7 * t), op(K.baseOp))
  else if (is(K.baseMode, 'point')) { ctx.globalAlpha = op(K.baseOp); ctx.fillStyle = css('--base'); for (const d of basePresent) if (d) ctx.fillRect(x(d[0]) - 0.75, y(d[1]) - 0.75, 1.5, 1.5); for (const d of base) if (d) ctx.fillRect(x(d[0]) - 0.75, y(d[1]) - 0.75, 1.5, 1.5); ctx.globalAlpha = 1 }
  const pos = is(K.position, 'present') ? basePresent : base, n = classes.length, counts = [0, 0, 0, 0]
  if (is(K.speciesMode, 'hex')) {
    // one translucent hexagon layer per class, stable first and decolonised on top as with the points, each hexagon's

  const u = quad.find(e.offsetX, e.offsetY, 10)
  if (e.altKey) {
    if (!u) return
    const s = state[K.selection] ?? []; state[K.selection] = selected(u.gcu_id_number) ? s.filter((id) => id !== u.gcu_id_number) : [...s, u.gcu_id_number]
    $('selCount').textContent = state[K.selection].length; draw(); post({ [K.selection]: state[K.selection] })   // the map draws the selection too
  } else if (u) chooseUnit(state[K.unit] === u.gcu_id_number ? null : u.gcu_id_number)   // click again = unchoose, as option-click deselects (Milko, 2026-11-12)
  else if (state[K.unit]) chooseUnit(null)
})
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state[K.unit]) chooseUnit(null) })
canvas.addEventListener('mousemove', (e) => {
  octx.clearRect(0, 0, W, H)
  if (box) { box[2] = e.offsetX; box[3] = e.offsetY; octx.fillStyle = 'rgba(31,78,156,.08)'; octx.strokeStyle = 'rgba(31,78,156,.6)'; octx.setLineDash([4, 3]); octx.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); octx.strokeRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); return }
  if (state[K.cursor]) drawCursor(e.offsetX, e.offsetY)
  if (!quad) return
  const u = quad.find(e.offsetX, e.offsetY, 10)
  if (u) {
    const c = cur(), q = unitXY(u, c), p = unitXY(u, presentOf(c)), d = unitPos(u), x = tx.rescaleX(x0), y = tx.rescaleY(y0), ux = Dict.unit(state[K.X]), uy = Dict.unit(state[K.Y]), T = Dict.title
    octx.beginPath(); octx.arc(x(d[0]), y(d[1]), 7, 0, 2 * Math.PI); octx.strokeStyle = '#222'; octx.lineWidth = 2; octx.stroke()
    tip.style.display = 'block'; tip.style.left = Math.min(e.offsetX + 14, W - 220) + 'px'; tip.style.top = e.offsetY + 14 + 'px'
    tip.innerHTML = `<b>${u.gcu_id_number}</b>${u['gcu_loc_coordinates-restriction'] ? ` (${T(LBL.restricted)})` : ''}${flagged(u) ? `<br><span style="color:#b71c1c">⚠ ${T(LBL.flagged)}: ${u[DIST].toFixed(1)} km</span>` : ''}${elevation(u)}<br>${fmt(q[0])} ${ux} · ${fmt(q[1])} ${uy}` + (c.present || !p ? '' : `<br>${T(state[K.period])}; ${T(LBL.unitsPresent)}: ${fmt(p[0])} ${ux} · ${fmt(p[1])} ${uy}`) + `<br>${u.species_list.join(', ')}`
  } else tip.style.display = 'none'
})
window.addEventListener('mouseup', (e) => {
  if (!box) return
  const [ax, ay, bx, by] = box; box = null; octx.clearRect(0, 0, W, H)
  if (Math.abs(bx - ax) < 6 || Math.abs(by - ay) < 6) return
  run.dragged = true
  const x = tx.rescaleX(x0), y = tx.rescaleY(y0)
  zoomTo([x.invert(Math.min(ax, bx)), x.invert(Math.max(ax, bx)), y.invert(Math.max(ay, by)), y.invert(Math.min(ay, by))])
})
canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; octx.clearRect(0, 0, W, H); $('cursorInfo').textContent = '' })
/** the cursor option: hairlines from the pointer to both axes, the X and Y values tagged on the axes and shown in the toolbar */
function drawCursor(px, py) {
  if (px < M.left || px > W - M.right || py < M.top || py > H - M.bottom) { $('cursorInfo').textContent = ''; return }
  const x = tx.rescaleX(x0), y = tx.rescaleY(y0), sx = `${fmt(x.invert(px))} ${Dict.unit(state[K.X])}`, sy = `${fmt(y.invert(py))} ${Dict.unit(state[K.Y])}`
  octx.save(); octx.strokeStyle = 'rgba(0,0,0,.55)'; octx.lineWidth = 1; octx.setLineDash([3, 3])
  octx.beginPath(); octx.moveTo(M.left, py + 0.5); octx.lineTo(W - M.right, py + 0.5); octx.moveTo(px + 0.5, M.top); octx.lineTo(px + 0.5, H - M.bottom); octx.stroke()
  octx.setLineDash([]); octx.font = '11px system-ui, sans-serif'; octx.textBaseline = 'middle'
  const tag = (t, cx, cy, align) => { const w = octx.measureText(t).width + 8, h = 16, left = align === 'right' ? cx - w : Math.min(Math.max(cx - w / 2, 0), W - w); octx.fillStyle = '#fff'; octx.strokeStyle = '#333'; octx.lineWidth = 1; octx.fillRect(left, cy - h / 2, w, h); octx.strokeRect(left + 0.5, cy - h / 2 + 0.5, w - 1, h - 1); octx.fillStyle = '#111'; octx.textAlign = 'left'; octx.fillText(t, left + 4, cy + 1) }
  tag(sx, px, H - M.bottom + 11, 'center'); tag(sy, M.left - 3, py, 'right')
  octx.restore()
  $('cursorInfo').textContent = `${sx} · ${sy}`
}

// ---- start: the dictionary's defaults, then the URL (any state key by its gid; shorthand species / point / bbox), then the service
const parse = (v) => { if (v === 'true') return true; if (v === 'false') return false; if (/^[\[{]/.test(v)) { try { return JSON.parse(v) } catch { return v } } return v !== '' && !isNaN(v) ? Number(v) : v }
Promise.all([Svc.catalogue(), Dict.defaults()]).then(async ([c, defaults]) => {
  cat = c; climates = c.climates
  // nothing chosen at first: no species, country or unit — the search is the first thing to use (Milko, 2026-11-12); then the settings remembered in this browser, then the URL
  state = { [K.cursor]: false, ...defaults, [K.species]: null, [K.X]: c.axes.pairs[0][K.X], [K.Y]: c.axes.pairs[0][K.Y], [K.selection]: [], ...Store.load('scatter', REMEMBER) }
  const q = new URLSearchParams(location.search)
  for (const k of Object.values(K)) if (q.has(k)) state[k] = parse(q.get(k))
  if (q.get('species') && c.species.find((s) => s.species === q.get('species'))) state[K.species] = q.get('species')
  if (!cur()) setClimate(climates.find((k) => k.src === 'eutrees4f' && k.present))   // the default climate: EU-Trees4F, reference period, historical scenario (Milko, 2026-11-12)
  if (q.get('embedded')) document.body.classList.add('embedded')
  if (q.get('settings')) document.body.classList.add('settings')   // the drawing settings open at load (dev and presets)
  await Dict.load([...Object.values(K), ...Object.values(OPT).flat(), ...LEGEND, ...Object.values(LBL), ...climates.flatMap((k) => [k[K.period], k[K.scenario]]), ...c.axes[K.X], ...c.axes[K.Y], 'ui_layout_scatterplot', 'ui_layout_scatterplot_base', 'ui_layout_scatterplot_species', 'ui_layout_scatterplot_units', 'ui_layout_scatterplot_layer', 'env_climate', 'ui_layout_label_reset', 'ui_layout_label_clear', 'ui_layout_label_source', 'ui_layout_scatterplot_label_hints', 'ui_layout_units_selection', 'ui_layout_label_search', 'latitude', 'longitude', ELEV])
  await Dict.labels(); Pop.shortLabels(); bindControls(); size()
  const pt = q.get('point')?.split(',').map(Number), bb = q.get('bbox')?.split(',').map(Number)
  if (pt?.length === 2) state[K.mapSel] = { type: 'Point', coordinates: pt }
  else if (bb?.length === 4) state[K.mapSel] = { type: 'Polygon', coordinates: [[[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]], [bb[0], bb[1]]]] }
  await refresh()
  if (state[K.zoom]) zoomTo(state[K.zoom])
  $('mapSelClear').addEventListener('click', () => { selectFromMap(null); post({ [K.mapSel]: null }) })   // the host clears the map too
  $('reset').addEventListener('click', resetView); $('reset').title = Dict.title('ui_layout_label_reset')
  $('settings').addEventListener('click', () => document.body.classList.toggle('settings'))
  Pop.bind(status); Pop.bind($('help')); Pop.set($('help'), Dict.title('ui_layout_scatterplot_label_hints'), Dict.def('ui_layout_scatterplot_label_hints'))
  $('selClear').addEventListener('click', () => { state[K.selection] = []; $('selCount').textContent = 0; draw(); post({ [K.selection]: [] }) })
  new ResizeObserver(() => { size(); draw() }).observe(wrap)
}).catch((e) => { setStatus(`service unavailable: ${e.message} (${Svc.BASE})`); $('legend').textContent = status.dataset.text })
</script>
