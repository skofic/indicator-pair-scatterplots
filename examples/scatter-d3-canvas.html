<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scatterplot — D3 + Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --base: #b9b9b9; --species: #1f4e9c; --unit: #e06a00; --future: #c2185b; --stable: #f2c200; --lost: #d7301f; --new: #2b6cd4; --map: #00897b; --ink: #222 }
  html, body { height: 100% }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); background: #fff; display: flex; flex-direction: column }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #ddd; flex: none }
  #search { background: #f6f6f6 }
  label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap }
  input[type=range] { width: 64px; vertical-align: middle }
  #wrap { position: relative; flex: 1 1 auto; min-height: 320px; margin: 4px 12px; overflow: hidden; cursor: crosshair }
  canvas, svg { position: absolute; left: 0; top: 0 }
  svg, #over { pointer-events: none }
  #tip { position: absolute; background: #fff; border: 1px solid #999; padding: 4px 8px; font-size: 12px; pointer-events: none; display: none; border-radius: 3px; z-index: 2; box-shadow: 0 1px 4px rgba(0,0,0,.2) }
  #status { padding: 4px 14px; color: #555; font-size: 12px; border-top: 1px solid #ddd; background: #fafafa; flex: none }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px }
  .grid line { stroke: #000; stroke-opacity: .06 } .grid path { display: none }
</style>
</head>
<body>
<div class="bar">
  <strong>D3 + Canvas</strong>
  <label>View <select id="view"><option value="layers">layers</option><option value="classes">suitability classes (EU-Trees4F Fig. 1)</option></select></label>
  <label>Product <select id="product"></select></label>
  <label>Scenario <select id="scenario"></select></label>
  <label>Period <select id="period"></select></label>
  <label>Base <select id="baseMode"><option value="points">points</option><option value="hex">hexagon density</option><option value="none">hidden</option></select> <input type="range" id="hexR" min="2" max="10" value="4" title="hexagon radius"> <input type="range" class="op" data-layer="base" min="0" max="100" value="100" title="opacity"></label>
  <label>Species <select id="speciesMode"><option value="points">points</option><option value="hex">hexagon density</option><option value="none">hidden</option></select> <input type="range" class="op" data-layer="species" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="envelope" checked> envelope (95 %): present dashed, selected solid</label>
  <label>Units <input type="range" class="op" data-layer="units" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="arrows" checked> arrows present → selected</label>
  <label><input type="checkbox" id="restricted" checked> include restricted units</label>
  <button id="reset" title="also: double-click the plot">reset view</button>
  <span id="classCtl" style="display:none">
    <label>Suitability <select id="variant"><option value="pot">potential (climate only)</option><option value="disp">with natural dispersal (MigClim)</option></select></label>
    <label>Cells at <select id="classPos"><option value="present">present climate</option><option value="future">selected period</option></select></label>
    <label>Bins <select id="binSize"><option value="0.5,50">0.5 °C × 50 mm</option><option value="1,100">1 °C × 100 mm</option><option value="2,200" selected>2 °C × 200 mm</option></select> ≥ <select id="binMin"><option>10</option><option>30</option><option selected>100</option><option>300</option></select> cells</label>
  </span>
</div>
<div class="bar" id="search">
  <label>Species <select id="speciesSel"></select></label>
  <label>Country <select id="country"><option value="">all</option></select></label>
  <label>Unit <select id="unitSel"><option value="">—</option></select></label>
  <span id="searchInfo"></span>
  <label title="data-quality flag: the climate values are read at the reference point">flag units whose reference point is &gt; <select id="flagKm"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>20</option></select> km from the polygon</label>
  <span id="mapSel" style="display:none">Map selection: <span id="mapSelInfo"></span> <button id="mapSelClear">clear</button></span>
  <label>Selection <span id="selCount">0</span> <select id="selMode"><option value="all">show all units</option><option value="only">only the selection</option><option value="hide">hide the selection</option></select> <button id="selClear">clear</button></label>
  <span id="legend"></span>
  <span style="color:#777">drag = zoom to box · wheel = zoom · shift-drag = pan · double-click = reset · option-click a unit = add to / remove from the selection</span>
</div>
<div id="wrap"><canvas id="c"></canvas><canvas id="over"></canvas><svg id="s"></svg><div id="tip"></div></div>
<div id="status">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-hexbin/0.2.2/d3-hexbin.min.js"></script>
<script>
const DATA = '../work/examples/data/', $ = (id) => document.getElementById(id), css = (v) => getComputedStyle(document.body).getPropertyValue(v)
const M = { top: 10, right: 16, bottom: 44, left: 62 }
const wrap = $('wrap'), canvas = $('c'), over = $('over'), svg = d3.select('#s'), tip = $('tip'), status = $('status'), ctx = canvas.getContext('2d'), octx = over.getContext('2d')
let W = 0, H = 0, tx = d3.zoomIdentity
const x0 = d3.scaleLinear(), y0 = d3.scaleLinear()
const gGX = svg.append('g').attr('class', 'grid'), gGY = svg.append('g').attr('class', 'grid'), gX = svg.append('g'), gY = svg.append('g'), xl = svg.append('text').attr('text-anchor', 'middle'), yl = svg.append('text').attr('text-anchor', 'middle')
const cache = {}, state = { species: 'Fagus sylvatica', climate: null, country: '', unit: '', hover: null, selection: new Set(), selMode: 'all', view: 'layers' }
let climates, meta, units = [], base = [], basePresent = [], speciesIdx = [], species = [], speciesPresent = [], quad, domainProduct = null, cells = null
// every file follows one global cell order (pair.js): base = the pair per cell at the selected climate (null = no value),
// basePresent = the same at the product's present, speciesIdx = the cells holding the species, cells = [lon, lat] per cell
let classes = ''   // class view: one class digit per cell
const pts = (idx, b) => { const o = []; for (const i of idx) if (b[i]) o.push(b[i]); return o }
// EU-Trees4F pairs each future map with the climate of the previous 30 years (paper, Methods: the current map, cur2005, is driven by 1961-1990)
const FUT_MAP = { '1991-2020': 'fut2035', '2021-2050': 'fut2065', '2051-2080': 'fut2095' }
const CLASS = { 1: ['stable', '--stable'], 2: ['decolonised', '--lost'], 3: ['newly suitable', '--new'] }
const classView = () => state.view === 'classes' && state.climate.src === 'eutrees4f' && !state.climate.present
const slug = (s) => s.replace(/\s+/g, '_'), file = (c) => `${c.src}-${c.period}${c.scenario ? '-' + c.scenario : ''}`
const load = async (name) => { if (!cache[name]) { const t = performance.now(); cache[name] = await (await fetch(DATA + name)).json(); status.textContent = `${name}: ${cache[name].length ?? Object.keys(cache[name]).length} rows in ${Math.round(performance.now() - t)} ms` } return cache[name] }
const presentOf = (c) => climates.find((k) => k.src === c.src && k.present)
const PRODUCT = { eutrees4f: 'EU-Trees4F (WorldClim 1.4 + EURO-CORDEX, 10 km)', worldclim: 'WorldClim 2.1 (1 km)', chelsa: 'CHELSA 2.1 (1 km)' }
const SCEN = { '': 'present (reference)', rcp45: 'RCP 4.5', rcp85: 'RCP 8.5', ssp370: 'MPI-ESM1-2-HR · SSP3-7.0' }
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : ''

// ---- the three-level climate selector: product → scenario → period, never across products
function fillSelectors(keep) {
  const prod = $('product'), scen = $('scenario'), per = $('period')
  const c = state.climate
  if (!keep) { prod.innerHTML = ''; for (const k of Object.keys(PRODUCT)) prod.add(new Option(PRODUCT[k], k, false, k === c.src)) }
  scen.innerHTML = ''; for (const s of [...new Set(climates.filter((k) => k.src === c.src).map((k) => k.scenario))]) scen.add(new Option(SCEN[s] ?? s, s, false, s === c.scenario))
  per.innerHTML = ''; for (const k of climates.filter((k) => k.src === c.src && k.scenario === c.scenario)) per.add(new Option(k.period, k.key, false, k.key === c.key))
}
function pick(src, scenario, period) {
  const cs = climates.filter((k) => k.src === src && (scenario == null || k.scenario === scenario))
  return cs.find((k) => k.period === period) ?? cs.find((k) => k.present) ?? cs[0]
}

function size() {
  W = wrap.clientWidth; H = wrap.clientHeight
  for (const [cv, cx] of [[canvas, ctx], [over, octx]]) { cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; cv.style.width = W + 'px'; cv.style.height = H + 'px'; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0) }
  svg.attr('width', W).attr('height', H)
  x0.range([M.left, W - M.right]); y0.range([H - M.bottom, M.top])
  xl.attr('x', (M.left + W - M.right) / 2).attr('y', H - 8).text(cap(meta?.pair.title.split(' × ')[0])); yl.attr('transform', `translate(13,${(M.top + H - M.bottom) / 2}) rotate(-90)`).text(cap(meta?.pair.title.split(' × ')[1]))
}
/** the axes are fixed per product from its present base, padded for the future shift, and never move on a period change */
function fixDomain(presentBase) {
  const xe = d3.extent(presentBase, (d) => d?.[0]), ye = d3.max(presentBase, (d) => d?.[1])
  x0.domain([Math.floor(xe[0] - 1), Math.ceil(xe[1] + 6)]); y0.domain([0, Math.ceil(ye * 1.1 / 500) * 500])
}
async function refresh() {
  const c = state.climate, p = presentOf(c)
  base = await load(`base-${file(c)}.json`); basePresent = c.present ? base : await load(`base-${file(p)}.json`)
  speciesIdx = await load(`species-${slug(state.species)}.json`)
  species = pts(speciesIdx, base); speciesPresent = c.present ? species : pts(speciesIdx, basePresent)
  units = await load(`units-${slug(state.species)}.json`)
  if (domainProduct !== c.src) { fixDomain(await load(`base-${file(p)}.json`)); domainProduct = c.src; tx = d3.zoomIdentity }
  const avail = c.src === 'eutrees4f' && !c.present
  $('view').options[1].disabled = !avail; if (!avail && state.view === 'classes') { state.view = 'layers'; $('view').value = 'layers' }
  $('classCtl').style.display = classView() ? '' : 'none'
  if (classView()) classes = (await load(`suitability-${slug(state.species)}.json`))[`${FUT_MAP[c.period]}|${c.scenario}|${$('variant').value}`] ?? ''
  $('legend').innerHTML = classView()
    ? `<span class="sw" style="background:var(--base)"></span>all cells, present and selected period<span class="sw" style="background:var(--stable)"></span>stable<span class="sw" style="background:var(--lost)"></span>decolonised<span class="sw" style="background:var(--new)"></span>newly suitable<span class="sw" style="background:var(--unit)"></span>units, present<span class="sw" style="background:var(--future)"></span>units, selected period<span class="sw" style="background:var(--map)"></span>map selection · arrows = mean climate shift per bin, thick = whole species envelope`
    : `<span class="sw" style="background:var(--base)"></span>all EU-Forest cells<span class="sw" style="background:var(--species)"></span>species<span class="sw" style="background:var(--unit)"></span>units, present<span class="sw" style="background:var(--future)"></span>units, selected period<span class="sw" style="background:var(--map)"></span>map selection <span class="sw" style="border:1.5px dashed #b71c1c;background:none;width:9px;height:9px"></span>reference point far from the polygon`
  refill(); draw()
}
/** where a unit is drawn: the class view keeps everything in the present climate space (the arrows show the shift) */
const unitPos = (u) => classView() ? unitXY(u, presentOf(state.climate)) : unitXY(u, state.climate)
function arrow(ax, ay, bx, by, w, head) {
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke()
  const ang = Math.atan2(by - ay, bx - ax); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - head * Math.cos(ang - 0.4), by - head * Math.sin(ang - 0.4)); ctx.lineTo(bx - head * Math.cos(ang + 0.4), by - head * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill()
}
/** EU-Trees4F Figure 1: every cell coloured by its suitability class (current binary map vs the selected period's), the
 *  cells drawn at their present or future pair values; arrows = mean shift present → future of the species' current
 *  envelope (classes stable + decolonised) per climate bin, the thick arrow for the whole envelope */
function drawClasses(x, y, drawHex, r, op) {
  const bm = $('baseMode').value
  if (bm === 'hex') drawHex(basePresent.filter(Boolean).concat(base.filter(Boolean)), r, (t) => d3.interpolateGreys(0.15 + 0.7 * t), op('base'))
  else if (bm === 'points') { ctx.globalAlpha = op('base'); ctx.fillStyle = css('--base'); for (const d of basePresent) if (d) ctx.fillRect(x(d[0]) - 0.75, y(d[1]) - 0.75, 1.5, 1.5); for (const d of base) if (d) ctx.fillRect(x(d[0]) - 0.75, y(d[1]) - 0.75, 1.5, 1.5); ctx.globalAlpha = 1 }
  const pos = $('classPos').value === 'present' ? basePresent : base, n = classes.length, counts = [0, 0, 0, 0]
  if ($('speciesMode').value !== 'none') {
    ctx.globalAlpha = op('species')
    for (const k of [1, 3, 2]) { ctx.fillStyle = css(CLASS[k][1]); const ch = String(k); for (let i = 0; i < n; i++) if (classes[i] === ch) { counts[k]++; const d = pos[i]; if (d) ctx.fillRect(x(d[0]) - 1, y(d[1]) - 1, 2, 2) } }
    ctx.globalAlpha = 1
  } else for (let i = 0; i < n; i++) counts[classes.charCodeAt(i) - 48]++
  if ($('arrows').checked) {
    const [bx, by] = $('binSize').value.split(',').map(Number), min = Number($('binMin').value), bins = new Map(), all = [0, 0, 0, 0, 0]
    for (let i = 0; i < n; i++) {
      if (classes[i] !== '1' && classes[i] !== '2') continue
      const a = basePresent[i], b = base[i]; if (!a || !b) continue
      const key = `${Math.floor(a[0] / bx)},${Math.floor(a[1] / by)}`; let s = bins.get(key); if (!s) bins.set(key, s = [0, 0, 0, 0, 0])
      for (const acc of [s, all]) { acc[0]++; acc[1] += a[0]; acc[2] += a[1]; acc[3] += b[0]; acc[4] += b[1] }
    }
    ctx.save(); ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; ctx.lineCap = 'round'
    for (const s of bins.values()) if (s[0] >= min) arrow(x(s[1] / s[0]), y(s[2] / s[0]), x(s[3] / s[0]), y(s[4] / s[0]), 1.2, 6)
    if (all[0]) { ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; arrow(x(all[1] / all[0]), y(all[2] / all[0]), x(all[3] / all[0]), y(all[4] / all[0]), 6, 14); ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; arrow(x(all[1] / all[0]), y(all[2] / all[0]), x(all[3] / all[0]), y(all[4] / all[0]), 3.5, 12) }
    ctx.restore()
  }
  return counts
}
const unitXY = (u, c) => u.values[c.key]
const flagged = (u) => u.distance != null && u.distance > Number($('flagKm').value)
function visibleUnits() {
  const s = state.selection, m = state.selMode
  return units.filter((u) => (state.country === '' || u.id.startsWith(state.country)) && (!state.unit || u.id === state.unit) && ($('restricted').checked || !u.restricted) && unitXY(u, state.climate)
    && (m === 'all' || (m === 'only' ? s.has(u.id) : !s.has(u.id))))
}

/** the 95 % envelope as a smooth closed contour: a blurred pixel histogram of the points, cut at the density
 *  level whose cells hold 95 % of the mass (the same rule as the Plotly page), traced with d3.contours */
function envelopePath(points, x, y) {
  const cell = 4, nx = Math.ceil(W / cell), ny = Math.ceil(H / cell), g = new Float64Array(nx * ny)
  for (const d of points) { const i = Math.floor(x(d[0]) / cell), j = Math.floor(y(d[1]) / cell); if (i >= 0 && i < nx && j >= 0 && j < ny) g[j * nx + i]++ }
  d3.blur2({ data: g, width: nx, height: ny }, 2.5)
  const sorted = Array.from(g).filter((v) => v > 0).sort((a, b) => b - a), total = d3.sum(sorted)
  let acc = 0, level = sorted[0] ?? 1
  for (const v of sorted) { acc += v; level = v; if (acc >= 0.95 * total) break }
  const polys = d3.contours().size([nx, ny]).thresholds([level])(g)[0]
  const path = new Path2D()
  for (const poly of polys.coordinates) for (const ring of poly) { ring.forEach(([px, py], k) => { const X = px * cell, Y = py * cell; k ? path.lineTo(X, Y) : path.moveTo(X, Y) }); path.closePath() }
  return path
}
function draw() {
  if (!base.length && !species.length) return
  const x = tx.rescaleX(x0), y = tx.rescaleY(y0), t0 = performance.now(), op = (l) => Number(document.querySelector(`input.op[data-layer=${l}]`).value) / 100
  ctx.clearRect(0, 0, W, H); ctx.save(); ctx.beginPath(); ctx.rect(M.left, M.top, W - M.left - M.right, H - M.top - M.bottom); ctx.clip()
  const drawHex = (pts, r, interp, alpha) => { const hex = d3.hexbin().x((d) => x(d[0])).y((d) => y(d[1])).radius(r).extent([[M.left, M.top], [W - M.right, H - M.bottom]]); const bins = hex(pts); const color = d3.scaleSequentialLog(interp).domain([1, d3.max(bins, (b) => b.length)]); const path = new Path2D(hex.hexagon()); ctx.globalAlpha = alpha; for (const b of bins) { ctx.fillStyle = color(b.length); ctx.save(); ctx.translate(b.x, b.y); ctx.fill(path); ctx.restore() } ctx.globalAlpha = 1 }
  const r = Number($('hexR').value), cv = classView()
  let counts = null
  if (cv) counts = drawClasses(x, y, drawHex, r, op)
  else if ($('baseMode').value === 'hex') drawHex(base.filter(Boolean), r, (t) => d3.interpolateGreys(0.15 + 0.7 * t), op('base'))
  else if ($('baseMode').value === 'points') { ctx.globalAlpha = op('base'); ctx.fillStyle = css('--base'); for (const d of base) if (d) ctx.fillRect(x(d[0]) - 0.75, y(d[1]) - 0.75, 1.5, 1.5); ctx.globalAlpha = 1 }
  if (cv) {}
  else if ($('speciesMode').value === 'hex') drawHex(species, r, (t) => d3.interpolateBlues(0.3 + 0.7 * t), op('species'))
  else if ($('speciesMode').value === 'points') { ctx.globalAlpha = op('species'); ctx.fillStyle = css('--species'); for (const d of species) ctx.fillRect(x(d[0]) - 1, y(d[1]) - 1, 2, 2); ctx.globalAlpha = 1 }
  if ($('envelope').checked) {
    ctx.save(); ctx.lineWidth = 2.2; ctx.lineJoin = 'round'
    if (!state.climate.present) { ctx.setLineDash([7, 5]); ctx.strokeStyle = '#0d2a66'; ctx.stroke(envelopePath(speciesPresent, x, y)) }
    ctx.setLineDash([]); ctx.strokeStyle = state.climate.present ? '#0d2a66' : '#8e0038'; ctx.stroke(envelopePath(species, x, y)); ctx.restore()
  }
  const vis = visibleUnits(), c = state.climate, p = presentOf(c), future = !c.present
  let mapN = 0
  if (state.mapSel) {
    ctx.save(); ctx.fillStyle = css('--map'); ctx.strokeStyle = css('--map'); ctx.lineWidth = 0.8
    if (future && $('arrows').checked) for (const i of state.mapSel.idx) { const a = basePresent[i], b = base[i]; if (a && b) arrow(x(a[0]), y(a[1]), x(b[0]), y(b[1]), 0.8, 5) }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1
    for (const i of state.mapSel.idx) { const b = base[i]; if (!b) continue; mapN++; ctx.beginPath(); ctx.rect(x(b[0]) - 2.5, y(b[1]) - 2.5, 5, 5); ctx.fill(); ctx.stroke() }
    ctx.restore()
  }
  ctx.globalAlpha = op('units')
  if ($('arrows').checked && future) {
    ctx.strokeStyle = 'rgba(224,106,0,.3)'; ctx.fillStyle = 'rgba(224,106,0,.5)'; ctx.lineWidth = 0.8
    for (const u of vis) { const a = unitXY(u, p), b = unitXY(u, c); if (!a || !b) continue; arrow(x(a[0]), y(a[1]), x(b[0]), y(b[1]), 0.8, 6) }
  }
  if (cv) { ctx.fillStyle = css('--future'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; for (const u of vis) { const q = unitXY(u, c); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), 2.2, 0, 2 * Math.PI); ctx.fill(); ctx.stroke() } }
  ctx.fillStyle = css(future && !cv ? '--future' : '--unit'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1
  for (const u of vis) { const q = unitPos(u); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), state.unit === u.id ? 6 : 3.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke() }
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2
  for (const u of vis) if (state.selection.has(u.id)) { const q = unitPos(u); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), 6.5, 0, 2 * Math.PI); ctx.stroke() }
  // the data-quality flag: a dashed dark-red ring on units whose reference point lies far from their polygon
  ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]); let nFlag = 0
  for (const u of vis) if (flagged(u)) { nFlag++; const q = unitPos(u); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), 8, 0, 2 * Math.PI); ctx.stroke() }
  ctx.setLineDash([])
  ctx.globalAlpha = 1; ctx.restore()
  gX.attr('transform', `translate(0,${H - M.bottom})`).call(d3.axisBottom(x)); gY.attr('transform', `translate(${M.left},0)`).call(d3.axisLeft(y))
  gGX.attr('transform', `translate(0,${H - M.bottom})`).call(d3.axisBottom(x).tickSize(-(H - M.top - M.bottom)).tickFormat('')); gGY.attr('transform', `translate(${M.left},0)`).call(d3.axisLeft(y).tickSize(-(W - M.left - M.right)).tickFormat(''))
  quad = d3.quadtree().x((u) => x(unitPos(u)[0])).y((u) => y(unitPos(u)[1])).addAll(vis)   // screen space: hit tests are pixel distances
  const what = cv ? `suitability around ${FUT_MAP[c.period].slice(3)} (climate ${c.period}, ${SCEN[c.scenario]}, ${$('variant').value === 'pot' ? 'potential' : 'with dispersal'}) vs current: ${counts[1]} stable, ${counts[2]} decolonised, ${counts[3]} newly suitable of ${basePresent.length} cells` : `${base.length} base, ${species.length} ${state.species}`
  const mapWhat = (state.mapSel ? ` · map selection: ${state.mapSel.label}, ${mapN} drawn` : '') + (nFlag ? ` · ${nFlag} flagged (reference point > ${$('flagKm').value} km from the polygon)` : '')
  status.textContent = `${c.label} · ${what}, ${vis.length} units shown (${units.filter((u) => u.restricted).length} restricted in all, ${state.selection.size} selected)${mapWhat} · drawn in ${Math.round(performance.now() - t0)} ms · zoom ×${tx.k.toFixed(1)}`
}
// ---- the map → scatterplot link: a GeoJSON Point or Polygon (WGS84) arrives by postMessage (or as ?point= / ?bbox=);
// the cells inside are found here on the static cell list — in the product the service answers with the index list
async function selectFromMap(geom) {
  if (!geom) { state.mapSel = null; $('mapSel').style.display = 'none'; draw(); return }
  cells ??= await load('cells.json')
  const idx = []
  if (geom.type === 'Point') {
    const [lon, lat] = geom.coordinates, cl = Math.cos(lat * Math.PI / 180) * 111.32; let best = -1, bd = Infinity
    for (let i = 0; i < cells.length; i++) { const dx = (cells[i][0] - lon) * cl, dy = (cells[i][1] - lat) * 111.32, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i } }
    // 1 km cells: the containing cell's centre lies within 0.71 km; beyond that the nearest surveyed cell up to 5 km is
    // shown with its distance (the product looks the point up in the full climate grid instead)
    const km = Math.sqrt(bd); if (km <= 5) idx.push(best)
    state.mapSel = { label: `point ${lat.toFixed(3)}, ${lon.toFixed(3)}` + (km <= 0.71 ? '' : km <= 5 ? ` — nearest surveyed cell ${km.toFixed(1)} km away` : ' — no surveyed cell within 5 km'), idx }
  } else if (geom.type === 'Polygon') {
    const ring = geom.coordinates[0], bx = d3.extent(ring, (p) => p[0]), by = d3.extent(ring, (p) => p[1])
    for (let i = 0; i < cells.length; i++) { const c = cells[i]; if (c[0] >= bx[0] && c[0] <= bx[1] && c[1] >= by[0] && c[1] <= by[1] && d3.polygonContains(ring, c)) idx.push(i) }
    state.mapSel = { label: `area with ${idx.length} surveyed cells`, idx }
  } else return
  $('mapSel').style.display = ''; $('mapSelInfo').textContent = state.mapSel.label; draw()
}
window.addEventListener('message', (e) => {
  if (e.data?.type === 'map-selection') selectFromMap(e.data.geometry)
  if (e.data?.type === 'species' && meta?.species.includes(e.data.name) && e.data.name !== state.species) { state.species = e.data.name; $('speciesSel').value = state.species; state.country = ''; state.unit = ''; refresh() }
})
// ---- interaction: wheel = zoom, shift-drag = pan, drag = box zoom, double-click = reset; hover on the overlay canvas
const zoom = d3.zoom().scaleExtent([1, 80]).filter((e) => e.type === 'wheel' || (e.type !== 'dblclick' && e.shiftKey)).on('zoom', (e) => { tx = e.transform; draw() })
const resetView = () => { d3.select(canvas).call(zoom.transform, d3.zoomIdentity) }
d3.select(canvas).call(zoom).on('dblclick.zoom', null)
canvas.addEventListener('dblclick', resetView)
let box = null
canvas.addEventListener('mousedown', (e) => { if (e.shiftKey || e.altKey || e.button !== 0) return; box = [e.offsetX, e.offsetY, e.offsetX, e.offsetY] })
// option-click on a hovered unit toggles it in the selection
canvas.addEventListener('click', (e) => {
  if (!e.altKey || !quad) return
  const u = quad.find(e.offsetX, e.offsetY, 10); if (!u) return
  if (state.selection.has(u.id)) state.selection.delete(u.id); else state.selection.add(u.id)
  $('selCount').textContent = state.selection.size; draw()
})
canvas.addEventListener('mousemove', (e) => {
  octx.clearRect(0, 0, W, H)
  if (box) { box[2] = e.offsetX; box[3] = e.offsetY; octx.fillStyle = 'rgba(31,78,156,.08)'; octx.strokeStyle = 'rgba(31,78,156,.6)'; octx.setLineDash([4, 3]); octx.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); octx.strokeRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); return }
  if (!quad) return
  const u = quad.find(e.offsetX, e.offsetY, 10)
  if (u) {
    const c = state.climate, q = unitXY(u, c), p = unitXY(u, presentOf(c)), d = unitPos(u), x = tx.rescaleX(x0), y = tx.rescaleY(y0)
    octx.beginPath(); octx.arc(x(d[0]), y(d[1]), 7, 0, 2 * Math.PI); octx.strokeStyle = '#222'; octx.lineWidth = 2; octx.stroke()
    tip.style.display = 'block'; tip.style.left = Math.min(e.offsetX + 14, W - 220) + 'px'; tip.style.top = e.offsetY + 14 + 'px'
    tip.innerHTML = `<b>${u.id}</b>${u.restricted ? ' (restricted)' : ''}${flagged(u) ? `<br><span style="color:#b71c1c">⚠ reference point ${u.distance.toFixed(1)} km from the unit polygon</span>` : ''}<br>${q[0].toFixed(1)} °C · ${Math.round(q[1])} mm` + (c.present ? '' : `<br>present: ${p[0].toFixed(1)} °C · ${Math.round(p[1])} mm`) + `<br>${u.species.join(', ')}`
  } else tip.style.display = 'none'
})
window.addEventListener('mouseup', (e) => {
  if (!box) return
  const [ax, ay, bx, by] = box; box = null; octx.clearRect(0, 0, W, H)
  if (Math.abs(bx - ax) < 6 || Math.abs(by - ay) < 6) return
  const x = tx.rescaleX(x0), y = tx.rescaleY(y0), X0 = Math.min(ax, bx), X1 = Math.max(ax, bx), Y0 = Math.min(ay, by), Y1 = Math.max(ay, by)
  const k = Math.min((W - M.left - M.right) / (X1 - X0), (H - M.top - M.bottom) / (Y1 - Y0), 80 / tx.k)
  // the box's data corners go to the plot's corners: screen = k · x0(d) + t  ⇒  t = corner − k · x0(corner data)
  const dx0 = x.invert(X0), dy1 = y.invert(Y0), nk = Math.min(80, tx.k * k)
  d3.select(canvas).call(zoom.transform, d3.zoomIdentity.translate(M.left - nk * x0(dx0), M.top - nk * y0(dy1)).scale(nk))
})
canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; octx.clearRect(0, 0, W, H) })
function refill() {
  const sel = units.filter((u) => $('restricted').checked || !u.restricted)
  const countries = [...new Set(sel.map((u) => u.id.slice(0, 3)))].sort()
  const cs = $('country'); cs.innerHTML = '<option value="">all</option>'; for (const c of countries) cs.add(new Option(`${c} (${sel.filter((u) => u.id.startsWith(c)).length})`, c, false, c === state.country))
  const us = $('unitSel'); us.innerHTML = '<option value="">—</option>'; for (const u of sel.filter((u) => !state.country || u.id.startsWith(state.country))) us.add(new Option(u.id + (u.restricted ? ' (restricted)' : '') + (flagged(u) ? ` ⚠ ${u.distance.toFixed(0)} km` : ''), u.id, false, u.id === state.unit))
  $('searchInfo').textContent = `${sel.length} units of ${state.species}`
}
Promise.all([fetch(DATA + 'climates.json').then((r) => r.json()), fetch(DATA + 'meta.json').then((r) => r.json())]).then(([cl, m]) => {
  climates = cl; meta = m
  const q = new URLSearchParams(location.search); if (q.get('species') && m.species.includes(q.get('species'))) state.species = q.get('species')
  state.climate = cl.find((c) => c.key === q.get('climate')) ?? cl.find((c) => c.key === 'worldclim|1970-2000|')
  for (const s of m.species) $('speciesSel').add(new Option(s, s, false, s === state.species))
  fillSelectors(false); size()
  refresh().then(() => {
    const pt = q.get('point')?.split(',').map(Number), bb = q.get('bbox')?.split(',').map(Number)
    if (pt?.length === 2) selectFromMap({ type: 'Point', coordinates: pt })
    else if (bb?.length === 4) selectFromMap({ type: 'Polygon', coordinates: [[[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]], [bb[0], bb[1]]]] })
  })
  $('mapSelClear').addEventListener('click', () => selectFromMap(null))
  $('product').addEventListener('change', (e) => { state.climate = pick(e.target.value, null, null); fillSelectors(true); refresh() })
  $('scenario').addEventListener('change', (e) => { state.climate = pick(state.climate.src, e.target.value, state.climate.period); fillSelectors(true); refresh() })
  $('period').addEventListener('change', (e) => { state.climate = cl.find((c) => c.key === e.target.value); refresh() })
  $('speciesSel').addEventListener('change', (e) => { state.species = e.target.value; state.country = ''; state.unit = ''; refresh() })
  if (q.get('view') === 'classes') { state.view = 'classes'; $('view').value = 'classes' }
  $('view').addEventListener('change', (e) => { state.view = e.target.value; refresh() })
  $('variant').addEventListener('change', refresh)
  for (const id of ['classPos', 'binSize', 'binMin']) $(id).addEventListener('change', draw)
  $('country').addEventListener('change', (e) => { state.country = e.target.value; state.unit = ''; refill(); draw() })
  $('unitSel').addEventListener('change', (e) => { state.unit = e.target.value; draw() })
  $('flagKm').addEventListener('change', () => { refill(); draw() })
  for (const id of ['baseMode', 'speciesMode', 'envelope', 'arrows', 'restricted']) $(id).addEventListener('change', () => { refill(); draw() })
  for (const r of document.querySelectorAll('input[type=range]')) r.addEventListener('input', draw)
  $('reset').addEventListener('click', resetView)
  $('selMode').addEventListener('change', (e) => { state.selMode = e.target.value; draw() })
  $('selClear').addEventListener('click', () => { state.selection.clear(); $('selCount').textContent = 0; draw() })
  new ResizeObserver(() => { size(); draw() }).observe(wrap)
})
</script>
</body>
