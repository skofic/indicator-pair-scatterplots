<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scatterplot — D3 + Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --base: #b9b9b9; --species: #1f4e9c; --unit: #e06a00; --future: #c2185b; --stable: #f2c200; --lost: #d7301f; --new: #2b6cd4; --map: #00897b; --ink: #222 }
  html, body { height: 100% }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); background: #fff; display: flex; flex-direction: column }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #ddd; flex: none }
  #search { background: #f6f6f6 }
  label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap }
  input[type=range] { width: 64px; vertical-align: middle }
  #wrap { position: relative; flex: 1 1 auto; min-height: 320px; margin: 4px 12px; overflow: hidden; cursor: crosshair }
  canvas, svg { position: absolute; left: 0; top: 0 }
  svg, #over { pointer-events: none }
  #tip { position: absolute; background: #fff; border: 1px solid #999; padding: 4px 8px; font-size: 12px; pointer-events: none; display: none; border-radius: 3px; z-index: 2; box-shadow: 0 1px 4px rgba(0,0,0,.2) }
  #status { padding: 4px 14px; color: #555; font-size: 12px; border-top: 1px solid #ddd; background: #fafafa; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px }
  .grid line { stroke: #000; stroke-opacity: .06 } .grid path { display: none }
  body.embedded .host { display: none }
  #disabled { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.82); color: #555; font-size: 15px; text-align: center; padding: 24px; z-index: 3 }
  body.disabled #disabled { display: flex } body.disabled .bar { opacity: .45; pointer-events: none }
</style>
</head>
<body>
<!-- Every label is a dictionary term (data-term: text = _title, hover = _definition); every control is bound to a key of
     the pane state (data-key = the term's gid), whose values are the gids of the enumeration elements. -->
<div class="bar">
  <strong data-term="ui_layout_scatterplot"></strong>
  <label><span data-term="ui_layout_scatterplot_view"></span> <select data-key="ui_layout_scatterplot_view"></select></label>
  <label><span data-term="ui_layout_label_source"></span> <select id="product"></select></label>
  <label><span data-term="env_climate_scenario"></span> <select data-key="env_climate_scenario"></select></label>
  <label><span data-term="env_climate_period"></span> <select data-key="env_climate_period"></select></label>
  <label><span data-term="ui_layout_scatterplot_base_mode"></span> <select data-key="ui_layout_scatterplot_base_mode"></select> <input type="range" data-key="ui_layout_scatterplot_layer_radius" min="2" max="10"> <input type="range" data-key="ui_layout_scatterplot_base_opacity" min="0" max="100"></label>
  <label id="basePosCtl"><span data-term="ui_layout_scatterplot_base_position"></span> <select data-key="ui_layout_scatterplot_base_position"></select></label>
  <label><span data-term="ui_layout_scatterplot_species_mode"></span> <select data-key="ui_layout_scatterplot_species_mode"></select> <input type="range" data-key="ui_layout_scatterplot_species_opacity" min="0" max="100"></label>
  <label><input type="checkbox" data-key="ui_layout_scatterplot_species_envelope"> <span data-term="ui_layout_scatterplot_species_envelope"></span></label>
  <label><span data-term="ui_layout_scatterplot_units_opacity"></span> <input type="range" data-key="ui_layout_scatterplot_units_opacity" min="0" max="100"></label>
  <label><input type="checkbox" data-key="ui_layout_scatterplot_layer_arrows"> <span data-term="ui_layout_scatterplot_layer_arrows"></span></label>
  <label class="host"><span data-term="gcu_loc_coordinates-restriction_level"></span> <select data-key="gcu_loc_coordinates-restriction_level"></select></label>
  <button id="reset" data-term="ui_layout_label_reset"></button>
  <span id="classCtl" style="display:none">
    <label><span data-term="ui_layout_scatterplot_view_classes_variant"></span> <select data-key="ui_layout_scatterplot_view_classes_variant"></select></label>
    <label><span data-term="ui_layout_scatterplot_view_classes_position"></span> <select data-key="ui_layout_scatterplot_view_classes_position"></select></label>
    <label><span data-term="ui_layout_scatterplot_view_classes_bin"></span> <select data-key="ui_layout_scatterplot_view_classes_bin"></select> ≥ <select data-key="ui_layout_scatterplot_view_classes_bin_min"><option>10</option><option>30</option><option>100</option><option>300</option></select> <span data-term="ui_layout_scatterplot_view_classes_bin_min"></span></label>
  </span>
</div>
<div class="bar" id="search">
  <label class="host"><span data-term="ui_layout_label_species"></span> <select data-key="species"></select></label>
  <label class="host"><span data-term="ui_layout_label_country"></span> <select data-key="gcu_id_country"></select></label>
  <label class="host"><span data-term="ui_layout_label_unit"></span> <select data-key="gcu_id_number"></select></label>
  <span id="searchInfo" class="host"></span>
  <label class="host"><span data-term="gcu_loc_climate_flag"></span> &gt; <select data-key="gcu_loc_climate_flag"><option>1</option><option>2</option><option>5</option><option>10</option><option>20</option></select> km</label>
  <span id="mapSel" style="display:none"><span data-term="ui_layout_scatterplot_label_map-selection"></span>: <span id="mapSelInfo"></span> <button id="mapSelClear" data-term="ui_layout_label_clear"></button></span>
  <label><span data-term="ui_layout_scatterplot_label_selection"></span> <span id="selCount">0</span> <select data-key="ui_layout_scatterplot_units_mode"></select> <button id="selClear" data-term="ui_layout_label_clear"></button></label>
  <span id="legend"></span>
  <span style="color:#777" data-term="ui_layout_scatterplot_label_hints"></span>
</div>
<div id="wrap"><canvas id="c"></canvas><canvas id="over"></canvas><svg id="s"></svg><div id="tip"></div><div id="disabled"></div></div>
<div id="status">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-hexbin/0.2.2/d3-hexbin.min.js"></script>
<script src="dictionary.js"></script>
<script>

  species: 'species', country: 'gcu_id_country', unit: 'gcu_id_number', level: 'gcu_loc_coordinates-restriction_level', flag: 'gcu_loc_climate_flag',

const LBL = { base: 'ui_layout_scatterplot_label_base', species: 'ui_layout_scatterplot_label_species', unitsPresent: 'ui_layout_scatterplot_label_units-present', unitsFuture: 'ui_layout_scatterplot_label_units-future', mapSel: 'ui_layout_scatterplot_label_map-selection', envPresent: 'ui_layout_scatterplot_label_envelope-present', envFuture: 'ui_layout_scatterplot_label_envelope-future', binArrows: 'ui_layout_scatterplot_label_bin-arrows', projection: 'ui_layout_scatterplot_label_projection', restricted: 'ui_layout_label_restricted', flagged: 'ui_layout_label_flagged', noData: 'ui_layout_label_no-data' }

const NUMERIC = new Set([K.flag, K.binMin, K.radius, K.baseOp, K.speciesOp, K.unitsOp])
let state = {}

const cache = {}, run = { mapIdx: [], mapLabel: '' }

// every file follows one global cell order (pair.js): base = the pair per cell at the selected climate (null = no value),

const cur = () => climates.find((k) => k.dataset === state[K.dataset]?.[0] && k.scenarioGid === state[K.scenario] && k.periodGid === state[K.period])
const presentOf = (c) => climates.find((k) => k.dataset === c.dataset && k.present)

  Dict.options(sc, [...new Set(climates.filter((k) => k.dataset === c.dataset).map((k) => k.scenarioGid))], c.scenarioGid)

}

  svg.attr('width', W).attr('height', H)
  x0.range([M.left, W - M.right]); y0.range([H - M.bottom, M.top])
  xl.attr('x', (M.left + W - M.right) / 2).attr('y', H - 8).text(axisLabel(state[K.X])); yl.attr('transform', `translate(13,${(M.top + H - M.bottom) / 2}) rotate(-90)`).text(axisLabel(state[K.Y]))

/** the axes are fixed per source from its present base, padded for the future shift, and never move on a period change */
function fixDomain(presentBase) {
  const xe = d3.extent(presentBase, (d) => d?.[0]), ye = d3.max(presentBase, (d) => d?.[1])

  units = await load(`units-${slug(state[K.species])}.json`)
  await Dict.load(units.map((u) => 'ISO_3166_1_' + u.id.slice(0, 3)))   // country names for the list

    : `${sw('--base')}${T(LBL.base)}${c.present ? '' : ` (${T(state[K.basePos]).toLowerCase()})`}${sw('--species')}${T(LBL.species)}${c.present ? '' : ` (${T(LBL.unitsPresent).split(',').pop().trim()})`}${sw('--unit')}${T(LBL.unitsPresent)}${sw('--future')}${T(LBL.unitsFuture)}${sw('--map')}${T(LBL.mapSel)} <span class="sw" style="border:1.5px dashed #b71c1c;background:none;width:9px;height:9px"></span>${T(LBL.flagged)}`)

/** where a unit is drawn: the class view keeps everything in the present climate space (the arrows show the shift) */
const unitXY = (u, c) => u.values[c.key]
const unitPos = (u) => classView() ? unitXY(u, presentOf(cur())) : unitXY(u, cur())
const flagged = (u) => u[DIST] != null && u[DIST] > state[K.flag]
const selected = (id) => (state[K.selection] ?? []).includes(id)
function visibleUnits() {
  const c = cur(), country = state[K.country] ? Dict.aid(state[K.country]) : ''

/** EU-Trees4F Figure 1: every cell coloured by its suitability class (current binary map vs the selected period's), the
 *  cells drawn at their present or future pair values; arrows = mean shift present → future of the species' current
 *  envelope (classes stable + decolonised) per climate bin, the thick arrow for the whole envelope */
function drawClasses(x, y, drawHex, r, op) {
  if (is(K.baseMode, 'hex')) drawHex(basePresent.filter(Boolean).concat(base.filter(Boolean)), r, (t) => d3.interpolateGreys(0.15 + 0.7 * t), op(K.baseOp))

    if (all[0]) { ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; arrow(x(all[1] / all[0]), y(all[2] / all[0]), x(all[3] / all[0]), y(all[4] / all[0]), 6, 14); ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; arrow(x(all[1] / all[0]), y(all[2] / all[0]), x(all[3] / all[0]), y(all[4] / all[0]), 3.5, 12) }

/** the 95 % envelope as a smooth closed contour: a blurred pixel histogram of the points, cut at the density
 *  level whose cells hold 95 % of the mass, traced with d3.contours */
function envelopePath(points, x, y) {
  const cell = 4, nx = Math.ceil(W / cell), ny = Math.ceil(H / cell), g = new Float64Array(nx * ny)
  for (const d of points) { const i = Math.floor(x(d[0]) / cell), j = Math.floor(y(d[1]) / cell); if (i >= 0 && i < nx && j >= 0 && j < ny) g[j * nx + i]++ }
  d3.blur2({ data: g, width: nx, height: ny }, 2.5)

  const polys = d3.contours().size([nx, ny]).thresholds([level])(g)[0]
  const path = new Path2D()
  for (const poly of polys.coordinates) for (const ring of poly) { ring.forEach(([px, py], k) => { const X = px * cell, Y = py * cell; k ? path.lineTo(X, Y) : path.moveTo(X, Y) }); path.closePath() }
  return path
}
function draw() {

  const x = tx.rescaleX(x0), y = tx.rescaleY(y0), t0 = performance.now(), op = (k) => state[k] / 100, T = Dict.title
  ctx.clearRect(0, 0, W, H); ctx.save(); ctx.beginPath(); ctx.rect(M.left, M.top, W - M.left - M.right, H - M.top - M.bottom); ctx.clip()

  const r = state[K.radius], cv = classView(), c = cur(), p = presentOf(c), future = !c.present
  // The species cloud is the reference: the realised niche, the climate of the places where the species grows today;
  // it never moves (decided 2026-11-09). What moves to the selected period: the units, the map-selected cells, the

  }

  for (const u of vis) { const q = unitPos(u); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), state[K.unit] === u.id ? 6 : 3.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke() }

  for (const u of vis) if (selected(u.id)) { const q = unitPos(u); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), 6.5, 0, 2 * Math.PI); ctx.stroke() }
  // the data-quality flag: a dashed dark-red ring on units whose reference point lies far from their polygon
  ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]); let nFlag = 0
  for (const u of vis) if (flagged(u)) { nFlag++; const q = unitPos(u); ctx.beginPath(); ctx.arc(x(q[0]), y(q[1]), 8, 0, 2 * Math.PI); ctx.stroke() }
  ctx.setLineDash([])

  gX.attr('transform', `translate(0,${H - M.bottom})`).call(d3.axisBottom(x)); gY.attr('transform', `translate(${M.left},0)`).call(d3.axisLeft(y))

  status.title = status.textContent = `${c.datasetTitle} · ${T(state[K.period])} · ${T(state[K.scenario])} · ${what}, ${vis.length} units shown (${units.filter((u) => u.restricted).length} ${T(LBL.restricted)} in all, ${(state[K.selection] ?? []).length} selected)${mapWhat} · drawn in ${Math.round(performance.now() - t0)} ms · zoom ×${tx.k.toFixed(1)}`

/** three expanding rings on the overlay canvas, so a point sent from the map is found at once */
function pulse(i) {
  const t0 = performance.now()

    const b = base[i]; if (!b) return

// ---- the map → scatterplot link: ui_layout_map_selection, a GeoJSON Point or Polygon (WGS84), arrives in a state message

async function selectFromMap(geom) {
  state[K.mapSel] = geom ?? null

    // 1 km cells: the containing cell's centre lies within 0.71 km; beyond that the nearest surveyed cell up to 5 km is
    // shown with its distance (the product looks the point up in the full climate grid instead)
    const km = Math.sqrt(bd); if (km <= 5) idx.push(best)
    run.mapLabel = `${lat.toFixed(3)}, ${lon.toFixed(3)}` + (km <= 0.71 ? '' : km <= 5 ? ` — nearest surveyed cell ${km.toFixed(1)} km away` : ' — no surveyed cell within 5 km')

// ---- messages: the host page (or the map, through it) sends partial states; this page sends its own changes back
const post = (partial) => { if (window.parent !== window) window.parent.postMessage({ type: 'state', ...partial }, '*') }
async function applyState(partial) {

  for (const [k, v] of Object.entries(partial)) if (k !== 'type' && k !== K.mapSel && !(k === K.species && noData)) state[k] = v
  // a species without scatterplot data invalidates the plot: the pane is disabled, not left showing another species
  document.body.classList.toggle('disabled', !!noData)

// ---- controls: every [data-key] element reads and writes its state key; enumerations get their options from the dictionary
const ON = {   // what a change of a key does beyond storing it (default: redraw)
  [K.view]: refresh, [K.variant]: refresh, [K.scenario]: () => { const c = cur() ?? climates.find((k) => k.dataset === state[K.dataset][0] && k.scenarioGid === state[K.scenario]); setClimate(c); refresh() }, [K.period]: refresh,

}
const read = (el) => el.type === 'checkbox' ? el.checked : (el.type === 'range' || NUMERIC.has(el.dataset.key)) ? Number(el.value) : (el.value === '' ? null : el.value)
function bindControls() {

    const k = el.dataset.key

function syncControls() { for (const el of document.querySelectorAll('[data-key]')) { const v = state[el.dataset.key]; if (el.type === 'checkbox') el.checked = !!v; else if (v != null) el.value = Array.isArray(v) ? v[0] : v } }

  const cs = $K(K.country); cs.innerHTML = '<option value="">—</option>'; for (const g of countries) cs.add(new Option(`${T(g)} (${sel.filter((u) => u.id.startsWith(Dict.aid(g))).length})`, g, false, g === state[K.country]))
  const country = state[K.country] ? Dict.aid(state[K.country]) : ''
  const us = $K(K.unit); us.innerHTML = '<option value="">—</option>'; for (const u of sel.filter((u) => !country || u.id.startsWith(country))) us.add(new Option(u.id + (u.restricted ? ` (${T(LBL.restricted)})` : '') + (flagged(u) ? ` ⚠ ${u[DIST].toFixed(0)} km` : ''), u.id, false, u.id === state[K.unit]))

// ---- interaction: wheel = zoom, shift-drag = pan, drag = box zoom, double-click = reset; hover on the overlay canvas
const zoom = d3.zoom().scaleExtent([1, 80]).filter((e) => e.type === 'wheel' || (e.type !== 'dblclick' && e.shiftKey)).on('zoom', (e) => { tx = e.transform; const x = tx.rescaleX(x0), y = tx.rescaleY(y0); state[K.zoom] = tx.k === 1 ? null : [x.invert(M.left), x.invert(W - M.right), y.invert(H - M.bottom), y.invert(M.top)]; draw() })
const resetView = () => { d3.select(canvas).call(zoom.transform, d3.zoomIdentity) }
/** show the data window [x0, x1, y0, y1]: screen = k · x0(d) + t  ⇒  t = corner − k · x0(corner data) */
function zoomTo([dx0, dx1, dy0, dy1]) {

let box = null
canvas.addEventListener('mousedown', (e) => { if (e.shiftKey || e.altKey || e.button !== 0) return; box = [e.offsetX, e.offsetY, e.offsetX, e.offsetY] })
// option-click on a hovered unit toggles it in the selection
canvas.addEventListener('click', (e) => {

  const u = quad.find(e.offsetX, e.offsetY, 10); if (!u) return
  const s = state[K.selection] ?? []; state[K.selection] = selected(u.id) ? s.filter((id) => id !== u.id) : [...s, u.id]

canvas.addEventListener('mousemove', (e) => {
  octx.clearRect(0, 0, W, H)
  if (box) { box[2] = e.offsetX; box[3] = e.offsetY; octx.fillStyle = 'rgba(31,78,156,.08)'; octx.strokeStyle = 'rgba(31,78,156,.6)'; octx.setLineDash([4, 3]); octx.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); octx.strokeRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); return }

  if (u) {
    const c = cur(), q = unitXY(u, c), p = unitXY(u, presentOf(c)), d = unitPos(u), x = tx.rescaleX(x0), y = tx.rescaleY(y0), ux = Dict.unit(state[K.X]), uy = Dict.unit(state[K.Y]), T = Dict.title

// ---- start: the dictionary's defaults, then the URL (any state key by its gid; shorthand species / point / bbox), then the data

  climates = cl; meta = m

  for (const k of Object.values(K)) if (q.has(k)) state[k] = parse(q.get(k))

  await refresh()

  const pt = q.get('point')?.split(',').map(Number), bb = q.get('bbox')?.split(',').map(Number)
  if (pt?.length === 2) selectFromMap({ type: 'Point', coordinates: pt })
  else if (bb?.length === 4) selectFromMap({ type: 'Polygon', coordinates: [[[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]], [bb[0], bb[1]]]] })
  else if (state[K.mapSel]) selectFromMap(state[K.mapSel])
  $('mapSelClear').addEventListener('click', () => { selectFromMap(null); post({ [K.mapSel]: null }) })   // the host clears the map too
  $('reset').addEventListener('click', resetView)
  $('selClear').addEventListener('click', () => { state[K.selection] = []; $('selCount').textContent = 0; draw() })
  new ResizeObserver(() => { size(); draw() }).observe(wrap)
})
