<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scatterplot — D3 + Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; --base: #c8c8c8; --species: #1f4e9c; --unit: #e06a00; --future: #c2185b; --ink: #222 }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: #fff }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #ddd }
  header label { display: inline-flex; gap: 6px; align-items: center }
  #wrap { position: relative; margin: 8px 16px }
  canvas, svg { position: absolute; left: 0; top: 0 }
  svg { pointer-events: none }
  #tip { position: absolute; background: #fff; border: 1px solid #999; padding: 4px 8px; font-size: 12px; pointer-events: none; display: none; border-radius: 3px }
  #status { padding: 4px 16px; color: #555; font-size: 12px }
  .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin: 0 4px 0 8px }
</style>
</head>
<body>
<header>
  <strong>D3 + Canvas</strong>
  <label>Climate <select id="source">
    <option value="worldclim-1970-2000">WorldClim 2.1 · 1970–2000</option>
    <option value="chelsa-1981-2010">CHELSA 2.1 · 1981–2010</option>
    <option value="chelsa-2041-2070">CHELSA 2.1 · 2041–2070 (SSP3-7.0)</option>
    <option value="chelsa-2071-2100">CHELSA 2.1 · 2071–2100 (SSP3-7.0)</option>
    <option value="eutrees4f-1961-1990">EU-Trees4F · 1961–1990 (10 km)</option>
  </select></label>
  <label>Units in <select id="unitsPeriod">
    <option value="present">present (CHELSA 1981–2010)</option>
    <option value="2041-2070">2041–2070</option>
    <option value="2071-2100">2071–2100</option>
  </select></label>
  <label><input type="checkbox" id="arrows" checked> arrows present → future</label>
  <label><input type="checkbox" id="density"> base as hexbin density</label>
  <label><input type="checkbox" id="showSpecies" checked> species</label>
  <button id="reset">reset zoom</button>
  <span class="legend"><span style="background:var(--base)"></span>all EU-Forest cells<span style="background:var(--species)"></span>Fagus sylvatica<span style="background:var(--unit)"></span>units<span style="background:var(--future)"></span>units, future</span>
</header>
<div id="wrap"><canvas id="c"></canvas><svg id="s"></svg><div id="tip"></div></div>
<div id="status">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-hexbin/0.2.2/d3-hexbin.min.js"></script>
<script>
const DATA = '../work/examples/data/'
const M = { top: 10, right: 20, bottom: 46, left: 64 }
const W = Math.min(window.innerWidth - 32, 1100), H = Math.max(420, window.innerHeight - 150)
const canvas = document.getElementById('c'), svg = d3.select('#s'), tip = document.getElementById('tip'), status = document.getElementById('status')
canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'
svg.attr('width', W).attr('height', H); document.getElementById('wrap').style.height = H + 'px'
const ctx = canvas.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio)
const x0 = d3.scaleLinear().range([M.left, W - M.right]), y0 = d3.scaleLinear().range([H - M.bottom, M.top])
let tx = d3.zoomIdentity, cache = {}, units, base = [], species = [], quad
const gX = svg.append('g'), gY = svg.append('g')
svg.append('text').attr('x', (M.left + W - M.right) / 2).attr('y', H - 8).attr('text-anchor', 'middle').text('Annual mean temperature (°C)')
svg.append('text').attr('transform', `translate(14,${(M.top + H - M.bottom) / 2}) rotate(-90)`).attr('text-anchor', 'middle').text('Annual precipitation (mm)')
const sel = (id) => document.getElementById(id)
const css = (v) => getComputedStyle(document.body).getPropertyValue(v)
async function load(name) {
  if (!cache[name]) { const t = performance.now(); cache[name] = await (await fetch(DATA + name)).json(); status.textContent = `${name}: ${cache[name].length} points in ${Math.round(performance.now() - t)} ms` }
  return cache[name]
}
function unitXY(u) { const p = sel('unitsPeriod').value; return p === 'present' ? u.present : u.future[p] }
async function refresh() {
  const k = sel('source').value
  base = await load(`base-${k}.json`); species = await load(`species-Fagus_sylvatica-${k}.json`)
  if (!units) units = await load('units-Fagus_sylvatica.json')
  x0.domain(d3.extent(base, (d) => d[0])).nice(); y0.domain([0, d3.max(base, (d) => d[1])]).nice()
  quad = d3.quadtree().x((u) => unitXY(u)[0]).y((u) => unitXY(u)[1]).addAll(units.filter((u) => unitXY(u)[0] != null))
  draw()
}
function draw() {
  const x = tx.rescaleX(x0), y = tx.rescaleY(y0)
  const t0 = performance.now()
  ctx.clearRect(0, 0, W, H); ctx.save(); ctx.beginPath(); ctx.rect(M.left, M.top, W - M.left - M.right, H - M.top - M.bottom); ctx.clip()
  if (sel('density').checked) {
    const hex = d3.hexbin().x((d) => x(d[0])).y((d) => y(d[1])).radius(6).extent([[M.left, M.top], [W - M.right, H - M.bottom]])
    const bins = hex(base), color = d3.scaleSequentialLog(d3.interpolateGreys).domain([1, d3.max(bins, (b) => b.length)])
    const hexPath = new Path2D(hex.hexagon())
    for (const b of bins) { ctx.fillStyle = color(b.length); ctx.save(); ctx.translate(b.x, b.y); ctx.fill(hexPath); ctx.restore() }
  } else { ctx.fillStyle = css('--base'); for (const d of base) ctx.fillRect(x(d[0]) - 0.75, y(d[1]) - 0.75, 1.5, 1.5) }
  if (sel('showSpecies').checked) { ctx.fillStyle = css('--species'); for (const d of species) ctx.fillRect(x(d[0]) - 1, y(d[1]) - 1, 2, 2) }
  const future = sel('unitsPeriod').value !== 'present'
  if (sel('arrows').checked && future) {
    ctx.strokeStyle = 'rgba(224,106,0,.45)'; ctx.lineWidth = 1
    for (const u of units) { const a = u.present, b = unitXY(u); if (a[0] == null || b[0] == null) continue; ctx.beginPath(); ctx.moveTo(x(a[0]), y(a[1])); ctx.lineTo(x(b[0]), y(b[1])); ctx.stroke() }
  }
  ctx.fillStyle = css(future ? '--future' : '--unit'); ctx.strokeStyle = '#fff'
  for (const u of units) { const p = unitXY(u); if (p[0] == null) continue; ctx.beginPath(); ctx.arc(x(p[0]), y(p[1]), 3.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke() }
  ctx.restore()
  gX.attr('transform', `translate(0,${H - M.bottom})`).call(d3.axisBottom(x)); gY.attr('transform', `translate(${M.left},0)`).call(d3.axisLeft(y))
  status.textContent = `${base.length} base + ${species.length} species + ${units.length} units drawn in ${Math.round(performance.now() - t0)} ms · zoom ×${tx.k.toFixed(1)}`
}
const zoom = d3.zoom().scaleExtent([1, 40]).translateExtent([[M.left, M.top], [W - M.right, H - M.bottom]]).extent([[M.left, M.top], [W - M.right, H - M.bottom]]).on('zoom', (e) => { tx = e.transform; draw() })
d3.select(canvas).call(zoom)
canvas.addEventListener('mousemove', (e) => {
  if (!quad) return
  const x = tx.rescaleX(x0), y = tx.rescaleY(y0), r = e.offsetX, s = e.offsetY
  const u = quad.find(x.invert(r), y.invert(s)); if (!u) return
  const p = unitXY(u), d = Math.hypot(x(p[0]) - r, y(p[1]) - s)
  if (d < 8) { tip.style.display = 'block'; tip.style.left = r + 12 + 'px'; tip.style.top = s + 12 + 'px'; tip.innerHTML = `<b>${u.id}</b>${u.restricted ? ' (restricted)' : ''}<br>${p[0].toFixed(1)} °C · ${Math.round(p[1])} mm<br>${u.species.join(', ')}` } else tip.style.display = 'none'
})
for (const id of ['source', 'unitsPeriod', 'arrows', 'density', 'showSpecies']) sel(id).addEventListener('change', refresh)
sel('reset').addEventListener('click', () => d3.select(canvas).call(zoom.transform, d3.zoomIdentity))
refresh()
</script>
</body>
</html>
