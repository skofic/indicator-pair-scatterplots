<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scatterplot — Plotly scattergl</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #222; background: #fff }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #ddd }
  header label { display: inline-flex; gap: 6px; align-items: center }
  #plot { height: calc(100vh - 110px); margin: 0 8px }
  #status { padding: 4px 16px; color: #555; font-size: 12px }
</style>
</head>
<body>
<header>
  <strong>Plotly scattergl (WebGL)</strong>
  <label>Climate <select id="source">
    <option value="worldclim-1970-2000">WorldClim 2.1 · 1970–2000</option>
    <option value="chelsa-1981-2010">CHELSA 2.1 · 1981–2010</option>
    <option value="chelsa-2041-2070">CHELSA 2.1 · 2041–2070 (SSP3-7.0)</option>
    <option value="chelsa-2071-2100">CHELSA 2.1 · 2071–2100 (SSP3-7.0)</option>
    <option value="eutrees4f-1961-1990">EU-Trees4F · 1961–1990 (10 km)</option>
  </select></label>
  <label>Units in <select id="unitsPeriod">
    <option value="present">present (CHELSA 1981–2010)</option>
    <option value="2041-2070">2041–2070</option>
    <option value="2071-2100">2071–2100</option>
  </select></label>
  <label><input type="checkbox" id="arrows" checked> arrows present → future</label>
</header>
<div id="plot"></div>
<div id="status">loading…</div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
const DATA = '../work/examples/data/', cache = {}, sel = (id) => document.getElementById(id), status = sel('status')
async function load(name) { if (!cache[name]) cache[name] = await (await fetch(DATA + name)).json(); return cache[name] }
async function refresh() {
  const t0 = performance.now(), k = sel('source').value, period = sel('unitsPeriod').value
  const [base, species, units] = await Promise.all([load(`base-${k}.json`), load(`species-Fagus_sylvatica-${k}.json`), load('units-Fagus_sylvatica.json')])
  const uxy = (u) => period === 'present' ? u.present : u.future[period]
  const us = units.filter((u) => uxy(u)[0] != null)
  const traces = [
    { type: 'scattergl', mode: 'markers', name: 'all EU-Forest cells', x: base.map((d) => d[0]), y: base.map((d) => d[1]), marker: { size: 2, color: '#c8c8c8' }, hoverinfo: 'skip' },
    { type: 'scattergl', mode: 'markers', name: 'Fagus sylvatica', x: species.map((d) => d[0]), y: species.map((d) => d[1]), marker: { size: 2.5, color: '#1f4e9c' }, hoverinfo: 'skip' },
  ]
  if (sel('arrows').checked && period !== 'present') {
    const x = [], y = []
    for (const u of us) { if (u.present[0] == null) continue; x.push(u.present[0], uxy(u)[0], null); y.push(u.present[1], uxy(u)[1], null) }
    traces.push({ type: 'scattergl', mode: 'lines', name: 'present → future', x, y, line: { color: 'rgba(224,106,0,.45)', width: 1 }, hoverinfo: 'skip' })
  }
  traces.push({ type: 'scattergl', mode: 'markers', name: period === 'present' ? 'units (present)' : `units (${period})`, x: us.map((u) => uxy(u)[0]), y: us.map((u) => uxy(u)[1]),
    text: us.map((u) => `${u.id}${u.restricted ? ' (restricted)' : ''}<br>${u.species.join(', ')}`), hovertemplate: '%{text}<br>%{x:.1f} °C · %{y:.0f} mm<extra></extra>',
    marker: { size: 7, color: period === 'present' ? '#e06a00' : '#c2185b', line: { color: '#fff', width: 1 } } })
  const layout = { margin: { l: 60, r: 20, t: 10, b: 50 }, xaxis: { title: { text: 'Annual mean temperature (°C)' } }, yaxis: { title: { text: 'Annual precipitation (mm)' } },
    legend: { orientation: 'h', y: 1.02 }, dragmode: 'zoom', hovermode: 'closest' }
  await Plotly.react('plot', traces, layout, { responsive: true, scrollZoom: true, displaylogo: false })
  status.textContent = `${base.length} base + ${species.length} species + ${us.length} units in ${Math.round(performance.now() - t0)} ms (including data fetch on first use) · drag to zoom, double-click to reset`
}
for (const id of ['source', 'unitsPeriod', 'arrows']) sel(id).addEventListener('change', refresh)
refresh()
</script>
</body>
</html>
