<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scatterplot — Plotly scattergl</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100% }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #222; background: #fff; display: flex; flex-direction: column }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #ddd; flex: none }
  #search { background: #f6f6f6 }
  label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap }
  input[type=range] { width: 64px; vertical-align: middle }
  #plot { flex: 1 1 auto; min-height: 320px; margin: 0 6px }
  #status { padding: 4px 14px; color: #555; font-size: 12px; border-top: 1px solid #ddd; background: #fafafa; flex: none }
</style>
</head>
<body>
<div class="bar">
  <strong>Plotly scattergl (WebGL)</strong>
  <label>Climate <select id="climate"></select></label>
  <label>Base <select id="baseMode"><option value="density">square density</option><option value="points">points</option><option value="none">hidden</option></select> <input type="range" id="bins" min="40" max="200" value="90" title="bins per axis"> <input type="range" class="op" data-layer="base" min="0" max="100" value="100" title="opacity"></label>
  <label>Species <select id="speciesMode"><option value="points">points</option><option value="density">square density</option><option value="none">hidden</option></select> <input type="range" class="op" data-layer="species" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="envelope" checked> envelope (95 %): present dashed, selected solid</label>
  <label>Units <input type="range" class="op" data-layer="units" min="0" max="100" value="100" title="opacity"></label>
  <label><input type="checkbox" id="arrows" checked> arrows present → selected</label>
  <label><input type="checkbox" id="restricted" checked> include restricted units</label>
</div>
<div class="bar" id="search">
  <label>Species <select id="speciesSel"></select></label>
  <label>Country <select id="country"><option value="">all</option></select></label>
  <label>Unit <select id="unitSel"><option value="">—</option></select></label>
  <span id="searchInfo"></span>
</div>
<div id="plot"></div>
<div id="status">loading…</div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
const DATA = '../work/examples/data/', $ = (id) => document.getElementById(id), status = $('status')
const cache = {}, state = { species: 'Fagus sylvatica', climate: null, country: '', unit: '' }
let climates, meta, units = []
const slug = (s) => s.replace(/\s+/g, '_'), file = (c) => `${c.src}-${c.period}${c.scenario ? '-' + c.scenario : ''}`
const load = async (name) => { if (!cache[name]) cache[name] = await (await fetch(DATA + name)).json(); return cache[name] }
const presentOf = (c) => climates.find((k) => k.src === c.src && k.present)
const op = (l) => Number(document.querySelector(`input.op[data-layer=${l}]`).value) / 100
/** a grid density and the count level enclosing 95 % of the points, for the envelope contour */
function grid(points, xr, yr, n) {
  const z = Array.from({ length: n }, () => new Array(n).fill(0)), dx = (xr[1] - xr[0]) / n, dy = (yr[1] - yr[0]) / n
  for (const [px, py] of points) { const i = Math.min(n - 1, Math.max(0, Math.floor((px - xr[0]) / dx))), j = Math.min(n - 1, Math.max(0, Math.floor((py - yr[0]) / dy))); z[j][i]++ }
  const counts = z.flat().filter((v) => v > 0).sort((a, b) => b - a); let acc = 0, level = 1
  for (const v of counts) { acc += v; level = v; if (acc >= 0.95 * points.length) break }
  return { z, x: Array.from({ length: n }, (_, i) => xr[0] + (i + 0.5) * dx), y: Array.from({ length: n }, (_, j) => yr[0] + (j + 0.5) * dy), level }
}
function visibleUnits() { return units.filter((u) => (!state.country || u.id.startsWith(state.country)) && (!state.unit || u.id === state.unit) && ($('restricted').checked || !u.restricted) && u.values[state.climate.key]) }
async function refresh() {
  const t0 = performance.now(), c = state.climate, p = presentOf(c), future = !c.present
  const [base, species, speciesPresent, basePresent] = await Promise.all([load(`base-${file(c)}.json`), load(`species-${slug(state.species)}-${file(c)}.json`), c.present ? null : load(`species-${slug(state.species)}-${file(p)}.json`), load(`base-${file(p)}.json`)])
  units = await load(`units-${slug(state.species)}.json`); refill()
  let xmin = Infinity, xmax = -Infinity, ymax = -Infinity
  for (const arr of [base, basePresent]) for (const [px, py] of arr) { if (px < xmin) xmin = px; if (px > xmax) xmax = px; if (py > ymax) ymax = py }
  const xr = [xmin, xmax], yr = [0, ymax]
  const n = Number($('bins').value), traces = []
  if ($('baseMode').value === 'density') { const g = grid(base, xr, yr, n); traces.push({ type: 'heatmap', x: g.x, y: g.y, z: g.z.map((r) => r.map((v) => v || null)), colorscale: [[0, '#e8e8e8'], [0.3, '#9a9a9a'], [1, '#3a3a3a']], zsmooth: false, showscale: false, opacity: op('base'), hoverinfo: 'skip', name: 'all EU-Forest cells' }) }
  else if ($('baseMode').value === 'points') traces.push({ type: 'scattergl', mode: 'markers', name: 'all EU-Forest cells', x: base.map((d) => d[0]), y: base.map((d) => d[1]), marker: { size: 2, color: '#b9b9b9' }, opacity: op('base'), hoverinfo: 'skip' })
  if ($('speciesMode').value === 'density') { const g = grid(species, xr, yr, n); traces.push({ type: 'heatmap', x: g.x, y: g.y, z: g.z.map((r) => r.map((v) => v || null)), colorscale: [[0, 'rgba(173,198,230,.7)'], [1, '#0b2d6b']], zsmooth: false, showscale: false, opacity: op('species'), hoverinfo: 'skip', name: state.species }) }
  else if ($('speciesMode').value === 'points') traces.push({ type: 'scattergl', mode: 'markers', name: state.species, x: species.map((d) => d[0]), y: species.map((d) => d[1]), marker: { size: 2.5, color: '#1f4e9c' }, opacity: op('species'), hoverinfo: 'skip' })
  if ($('envelope').checked) {
    const env = (pts, dash, color, name) => { const g = grid(pts, xr, yr, 70); traces.push({ type: 'contour', x: g.x, y: g.y, z: g.z, contours: { coloring: 'none', start: g.level, end: g.level, size: 1 }, line: { color, width: 1.5, dash }, showscale: false, hoverinfo: 'skip', name, showlegend: true }) }
    if (future) env(speciesPresent, 'dash', '#1f4e9c', 'envelope, present')
    env(species, 'solid', future ? '#c2185b' : '#1f4e9c', future ? 'envelope, selected period' : 'envelope')
  }
  const vis = visibleUnits()
  if ($('arrows').checked && future) {
    const x = [], y = []
    for (const u of vis) { const a = u.values[p.key], b = u.values[c.key]; if (!a || !b) continue; x.push(a[0], b[0], null); y.push(a[1], b[1], null) }
    traces.push({ type: 'scattergl', mode: 'lines', name: 'present → selected', x, y, line: { color: 'rgba(224,106,0,.55)', width: 1 }, opacity: op('units'), hoverinfo: 'skip' })
  }
  traces.push({ type: 'scattergl', mode: 'markers', name: future ? `units, ${c.period}` : 'units, present', x: vis.map((u) => u.values[c.key][0]), y: vis.map((u) => u.values[c.key][1]),
    text: vis.map((u) => `${u.id}${u.restricted ? ' (restricted)' : ''}<br>${u.species.join(', ')}` + (future ? `<br>present: ${u.values[p.key][0].toFixed(1)} °C · ${Math.round(u.values[p.key][1])} mm` : '')), hovertemplate: '%{text}<br>%{x:.1f} °C · %{y:.0f} mm<extra></extra>',
    marker: { size: vis.map((u) => u.id === state.unit ? 12 : 7), color: future ? '#c2185b' : '#e06a00', line: { color: '#fff', width: 1 } }, opacity: op('units') })
  const [xt, yt] = meta.pair.title.split(' × ')
  const layout = { margin: { l: 60, r: 20, t: 8, b: 48 }, xaxis: { title: { text: xt }, range: xr }, yaxis: { title: { text: yt }, range: yr }, legend: { orientation: 'h', y: 1.02 }, dragmode: 'zoom', hovermode: 'closest' }
  await Plotly.react('plot', traces, layout, { responsive: true, scrollZoom: true, displaylogo: false })
  status.textContent = `${c.label} · ${base.length} base, ${species.length} ${state.species}, ${vis.length} units · ${Math.round(performance.now() - t0)} ms · drag to zoom, double-click to reset`
}
function refill() {
  const sel = units.filter((u) => $('restricted').checked || !u.restricted)
  const cs = $('country'); cs.innerHTML = '<option value="">all</option>'; for (const c of [...new Set(sel.map((u) => u.id.slice(0, 3)))].sort()) cs.add(new Option(`${c} (${sel.filter((u) => u.id.startsWith(c)).length})`, c, false, c === state.country))
  const us = $('unitSel'); us.innerHTML = '<option value="">—</option>'; for (const u of sel.filter((u) => !state.country || u.id.startsWith(state.country))) us.add(new Option(u.id + (u.restricted ? ' (restricted)' : ''), u.id, false, u.id === state.unit))
  $('searchInfo').textContent = `${sel.length} units of ${state.species}`
}
Promise.all([fetch(DATA + 'climates.json').then((r) => r.json()), fetch(DATA + 'meta.json').then((r) => r.json())]).then(([cl, m]) => {
  climates = cl; meta = m
  const q = new URLSearchParams(location.search); if (q.get('species') && m.species.includes(q.get('species'))) state.species = q.get('species')
  const want = q.get('climate') && cl.some((c) => c.key === q.get('climate')) ? q.get('climate') : 'worldclim|1970-2000|'
  for (const c of cl) $('climate').add(new Option(c.label, c.key, false, c.key === want))
  state.climate = cl.find((c) => c.key === want)
  for (const s of m.species) $('speciesSel').add(new Option(s, s, false, s === state.species))
  refresh()
  $('climate').addEventListener('change', (e) => { state.climate = cl.find((c) => c.key === e.target.value); refresh() })
  $('speciesSel').addEventListener('change', (e) => { state.species = e.target.value; state.country = ''; state.unit = ''; refresh() })
  $('country').addEventListener('change', (e) => { state.country = e.target.value; state.unit = ''; refresh() })
  $('unitSel').addEventListener('change', (e) => { state.unit = e.target.value; refresh() })
  for (const id of ['baseMode', 'speciesMode', 'envelope', 'arrows', 'restricted']) $(id).addEventListener('change', refresh)
  for (const r of document.querySelectorAll('input[type=range]')) r.addEventListener('change', refresh)
})
</script>
</body>
</html>
